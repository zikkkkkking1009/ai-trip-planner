# mypy 配置（C3）
#
# 基调：**渐进式**，不是一次性全量严格。
# 这个代码库此前从未做过静态类型检查，直接开 strict 会产生几百条报错，
# 结果一定是「全部 ignore」——那这道门就成了摆设。
#
# 所以：默认只检查**有类型标注的函数**（mypy 默认不进未标注函数体），
# 先把已标注部分的真类型错误抓干净；未标注部分靠后续逐步补标注来纳入。
# 每次补标注就收紧一点，比一次性全开更有意义。

[mypy]
python_version = 3.12

# 第三方库大多没有类型存根（openai / uvicorn 等），不忽略会刷出满屏 import 错误
ignore_missing_imports = True

# 不检查未标注函数的函数体 —— 渐进式的关键开关
check_untyped_defs = False

# 以下都是"抓真 bug"级别的，不是风格问题。
# ⚠️ INI 解析器不支持布尔值后面跟行内注释（会静默整条忽略，mypy 只给一行
#    "Not a boolean" 提示、不报错），所以注释一律写在**独立行**。
# 默认参数 = None 但标注成 str —— 实为隐藏的 None 漏洞
no_implicit_optional = True
warn_redundant_casts = True
# 防止 # type: ignore 变成永久沉积的垃圾
warn_unused_ignores = True
# 声明返回 dict 却返回了 Any —— 等于类型信息丢失
warn_return_any = True

# 不要求全局标注（否则每个未标注函数都报错，直接劝退）
disallow_untyped_defs = False
disallow_untyped_calls = False

show_error_codes = True
pretty = True

# run_demo.py / 各 __main__ 脚本是演示与手工入口，标注缺失严重且不进生产路径
[mypy-run_demo]
ignore_errors = True
