name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Frontend static check (syntax + shadowing guard)
        run: python tools/check_frontend.py

      # 五维健壮性审计：超时 / 重试 / 状态 / 日志 / 成本（静态检查，不需要密钥）
      # 立这道门的原因：这几条底线靠人记记不住 —— 历史上出现过
      # 「缺常量导致接口 500」「漏传城市导致详情卡 404」「except: pass 吞掉异常」
      - name: Backend robustness audit (timeout/retry/state/log/cost)
        run: python tools/check_backend_health.py

      - name: Frontend runtime smoke test (jsdom)
        run: |
          npm install jsdom --no-save --prefix tools
          NODE_PATH=tools/node_modules node tools/frontend_smoke.js

      - name: Run unit tests
        working-directory: backend
        run: |
          pytest tests/ -q --tb=short > pytest_output.txt 2>&1 || {
            echo "PYTEST FAILED, dumping tail to annotation..."
            python -c "import urllib.parse; print('::error::' + urllib.parse.quote(open('pytest_output.txt', encoding='utf-8', errors='ignore').read()[-1500:]))"
            exit 1
          }
          tail -n 5 pytest_output.txt

      - name: Smoke test solver demo (no API key needed)
        working-directory: backend
        run: python run_demo.py
