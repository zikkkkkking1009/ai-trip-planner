name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt pytest httpx

      - name: Run unit tests
        working-directory: backend
        run: |
          pytest tests/ -q --tb=short > pytest_output.txt 2>&1 || {
            echo "PYTEST FAILED, dumping tail to annotation..."
            python -c "import urllib.parse; print('::error::' + urllib.parse.quote(open('pytest_output.txt', encoding='utf-8', errors='ignore').read()[-1500:]))"
            exit 1
          }
          tail -n 5 pytest_output.txt

      - name: Smoke test solver demo (no API key needed)
        working-directory: backend
        run: python run_demo.py
