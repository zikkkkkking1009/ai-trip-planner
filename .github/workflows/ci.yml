name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # ⚠️ 必须是 22，不能是 20 —— 2026-09-28 CI 连挂 10 次（#82~#91）就是这个原因：
          # jsdom 30.x 的传递依赖 undici 用了 Node 22 才有的 webidl.util.markAsUncloneable，
          # 在 Node 20 上 require('jsdom') 直接 TypeError 崩掉，冒烟步骤连断言都没跑到。
          # ⚠️ 开发机是 Node 22 ⇒ 本地一直绿、CI 一路红，这种"只在 CI 复现"的最难查。
          # 实测：把 jsdom 钉到 30.1.1 在 Node 20 上**照样崩** ⇒ 光钉版本没用，只能升 Node。
          # 排查手法：npx -y node@20 tools/frontend_smoke.js（用 CI 那个版本跑一遍）。
          node-version: "22"

      - name: Frontend static check (syntax + shadowing guard)
        run: python tools/check_frontend.py

      # 对比度门禁（静态解析，零依赖）。为什么必须进 CI：
      # 令牌一改就可能踩 WCAG 红线，而"看着还行"肉眼根本发现不了。
      # 只在开发机跑的是 tools/contrast_runtime.js —— 它要 playwright + 真实浏览器，
      # 进 CI 又慢又脆，留在本地做真渲染复核。
      - name: Contrast gate (page-level tokens)
        run: python tools/check_contrast.py

      - name: Contrast gate (design spec, light + dark)
        run: python docs/design/contrast-audit.py --check

      # 五维健壮性审计：超时 / 重试 / 状态 / 日志 / 成本（静态检查，不需要密钥）
      # 立这道门的原因：这几条底线靠人记记不住 —— 历史上出现过
      # 「缺常量导致接口 500」「漏传城市导致详情卡 404」「except: pass 吞掉异常」
      - name: Backend robustness audit (timeout/retry/state/log/cost)
        run: python tools/check_backend_health.py

      # 首页/规划页的运行时断言（jsdom）。为什么失败时要往 annotation 里丢尾巴：
      # 2026-09-28 这次挂了 10 次，而 Actions 日志要登录才看得到 —— 光是"看不到错"就拖了很久。
      # 写法与下面 pytest 那步一致，让失败原因直接出现在 Actions 摘要上。
      - name: Frontend runtime smoke test (jsdom)
        run: |
          # 钉住 jsdom 版本：之前不钉，上游一发新版就可能让 CI 突然红，
          # 而且报错是 undici/Node 的内部栈、完全看不出跟我们代码有关。
          npm install jsdom@30.1.1 --no-save --prefix tools
          NODE_PATH=tools/node_modules node tools/frontend_smoke.js > smoke_frontend.log 2>&1 || {
            echo "FRONTEND SMOKE FAILED, dumping tail to annotation..."
            python -c "import urllib.parse; print('::error::' + urllib.parse.quote(open('smoke_frontend.log', encoding='utf-8', errors='ignore').read()[-1500:]))"
            exit 1
          }
          tail -n 3 smoke_frontend.log

      # 酒店选择器 + 长图 + 主题切换的运行时断言。
      # 立这道门的原因（真实事故）：「点搜索」曾因把 click 事件当 page 传给后端
      # 而 500 —— 静态检查和单元测试都发现不了，只有真跑一遍并断言 DOM 才抓得到。
      - name: Hotel picker runtime smoke test (jsdom)
        run: |
          NODE_PATH=tools/node_modules node tools/hotel_smoke.js > smoke_hotel.log 2>&1 || {
            echo "HOTEL PICKER SMOKE FAILED, dumping tail to annotation..."
            python -c "import urllib.parse; print('::error::' + urllib.parse.quote(open('smoke_hotel.log', encoding='utf-8', errors='ignore').read()[-1500:]))"
            exit 1
          }
          tail -n 3 smoke_hotel.log

      # 首页检索问答演示框的运行时断言。
      # 立这道门的原因：R1~R4 把检索层做完了却只在后端，页面没有入口 ——
      # 而「新增一个交互 UI」恰恰是最容易在后续改版中被整块删掉又没人发现的东西。
      # 这套用例含反向断言（grounded=false 必须标红、LLM 降级不能崩），
      # 并已验证「拿改动前的 home.html 跑会干净报红」，不是恒绿的摆设。
      - name: Home Q&A demo runtime smoke test (jsdom)
        run: |
          NODE_PATH=tools/node_modules node tools/home_ask_smoke.js > smoke_home_ask.log 2>&1 || {
            echo "HOME ASK SMOKE FAILED, dumping tail to annotation..."
            python -c "import urllib.parse; print('::error::' + urllib.parse.quote(open('smoke_home_ask.log', encoding='utf-8', errors='ignore').read()[-1500:]))"
            exit 1
          }
          tail -n 3 smoke_home_ask.log

      # ruff / mypy（C3）。为什么必须进 CI：
      # 「缺常量导致接口 500」这类问题能靠肉眼 review 漏掉、也能被单元测试漏掉，
      # 但 pyflakes 一眼就看得到。配置见 backend/ruff.toml 与 backend/mypy.ini。
      - name: Lint (ruff)
        working-directory: backend
        run: ruff check .

      - name: Type check (mypy)
        working-directory: backend
        run: mypy .

      - name: Run unit tests
        working-directory: backend
        run: |
          pytest tests/ -q --tb=short > pytest_output.txt 2>&1 || {
            echo "PYTEST FAILED, dumping tail to annotation..."
            python -c "import urllib.parse; print('::error::' + urllib.parse.quote(open('pytest_output.txt', encoding='utf-8', errors='ignore').read()[-1500:]))"
            exit 1
          }
          tail -n 5 pytest_output.txt

      # RAG 真实问题基准：用「用户真会问的话」给检索层打分。
      # 为什么必须进 CI —— 现有的 golden 30 条是自造的（query→专名），hit@1 90.0 / MRR 0.940
      # 看起来很漂亮，但换成真实问法实测 12 条只有 3 条全对（「西安有什么好吃的」→ 青岛·流亭猪蹄、
      # 「拉萨必去的景点」→ 威海·猫头山）。**分数高和能用是两回事**，缺的就是这道门。
      # 它只做退化拦截：分数低于基线直接红；高于基线只提醒抬基线，不判负。
      - name: RAG real-question benchmark (regression gate)
        run: |
          python tools/rag_realbench.py > realbench.log 2>&1 || {
            echo "RAG REALBENCH REGRESSED, dumping to annotation..."
            python -c "import urllib.parse; print('::error::' + urllib.parse.quote(open('realbench.log', encoding='utf-8', errors='ignore').read()[-1800:]))"
            exit 1
          }
          tail -n 4 realbench.log

      # 排序质量门禁：量「一条 query 多个相关实体」的 top-k 质量。
      # 为什么这道不可省 —— 上面两道量的是「该不该答」「答对没」，
      # 都没量**排序形状**：rag_golden.json 每条 query 只允许 1 个 ground truth
      # （eval_rag.py:46 禁止重复 q），所以「top1 对但 2-5 名全是噪声」与
      # 「top1-3 名都对」在 hit@1/hit@5/MRR 下同分（都记 rank=1）。
      # 实测现线：precision@5 只有 0.58 —— 「北京必去的地方」top5 里
      # 第 2、3 名是烤鸭和卤煮（美食串味）。这个数字比 hit@1 90% 难看得多，
      # 但它才是用户实际感受到的排序质量。先把尺子立起来，再谈提升。
      - name: RAG ranking quality gate (multi-ground-truth)
        run: |
          python tools/rag_rank_eval.py > rank.log 2>&1 || {
            echo "RAG RANKING REGRESSED, dumping to annotation..."
            python -c "import urllib.parse; print('::error::' + urllib.parse.quote(open('rank.log', encoding='utf-8', errors='ignore').read()[-1800:]))"
            exit 1
          }
          tail -n 3 rank.log

      - name: Smoke test solver demo (no API key needed)
        working-directory: backend
        run: python run_demo.py
