services:
  app:
    build: .
    image: ai-trip-planner:latest
    ports:
      - "8000:8000"
    env_file:
      - backend/.env           # 密钥不进镜像，运行时注入
    environment:
      - LOG_LEVEL=INFO
      - LOG_FILE=/app/data/app.log
    volumes:
      - ./data:/app/data       # 规划快照 / 收藏 / 媒体缓存持久化
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
