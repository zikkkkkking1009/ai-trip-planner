services:
  app:
    build: .
    image: ai-trip-planner:latest
    ports:
      # 只绑回环：花生壳客户端与容器同机，连 127.0.0.1:8000 即可。
      # 写成 "8000:8000" 会绑到 0.0.0.0 —— 同一局域网里任何人都能直连进来，
      # 还能伪造 X-Forwarded-For 绕过按 IP 的限流。少一个暴露面。
      - "127.0.0.1:8000:8000"
    env_file:
      - backend/.env           # 密钥不进镜像，运行时注入
    environment:
      - LOG_LEVEL=INFO
      - LOG_FILE=/app/data/app.log
    volumes:
      - ./data:/app/data       # 规划快照 / 收藏 / 媒体缓存持久化
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
