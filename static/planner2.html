<script>
(function () {
  var KEY = 'theme';
  var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  var SUN = '<svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="8" cy="8" r="3.1"/><path d="M8 1.4v1.7M8 12.9v1.7M1.4 8h1.7M12.9 8h1.7M3.3 3.3l1.2 1.2M11.5 11.5l1.2 1.2M12.7 3.3l-1.2 1.2M4.5 11.5l-1.2 1.2"/></svg>';
  var MOON = '<svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13.6 9.6A5.6 5.6 0 0 1 6.4 2.4a5.6 5.6 0 1 0 7.2 7.2z"/></svg>';
  function saved() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }
  window.themeApply = function (s) {
    var dark = s === 'dark' || (s !== 'light' && !!(mq && mq.matches));
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    var b = document.getElementById('themeBtn');
    if (b) {
      b.innerHTML = dark ? MOON : SUN;
      b.title = '主题：' + (s === 'dark' ? '暗色' : s === 'light' ? '亮色' : '跟随系统') + '（点击切换）';
      b.dataset.mode = s || 'auto';
    }
  };
  window.cycleTheme = function () {
    var dark = document.documentElement.getAttribute('data-theme') === 'dark';
    var next = dark ? 'light' : 'dark';
    try { localStorage.setItem(KEY, next); } catch (e) {}
    window.themeApply(next);
  };
  window.themeApply(saved());
  if (mq && mq.addEventListener) {
    mq.addEventListener('change', function () { if (!saved()) window.themeApply(null); });
  }
  document.addEventListener('DOMContentLoaded', function () { window.themeApply(saved()); });
})();
</script>

  /* ---- 令牌面板 / toast（同 support）---- */
  .token-panel { position:fixed; top:54px; right:24px; z-index:600; width:264px;

  .auth-toast { position:fixed; top:62px; left:50%; transform:translateX(-50%); z-index:700; max-width:340px;
                background:var(--surface); border:1px solid var(--bad-line); border-radius:10px; padding:10px 14px;
                box-shadow:var(--sh-3); font-size:13px; color:var(--fg); }

</style>
</head>

<script src="/static/vendor/leaflet.js"></script>
<script>
/* 访问令牌：与全站共用 localStorage('appToken')（support 同款面板） */
(function () {
  var KEY = 'appToken';
  var btn = document.getElementById('tokenBtn');
  var panel = document.getElementById('tokenPanel');
  var input = document.getElementById('tokenInput');
  if (!btn || !panel) return;
  function openIt() {
    if (input) { try { input.value = localStorage.getItem(KEY) || ''; } catch (e) {} }
    panel.hidden = false;
    if (input && !input.value && input.focus) input.focus();
  }
  btn.addEventListener('click', function () { if (panel.hidden) openIt(); else panel.hidden = true; });
  document.addEventListener('click', function (e) {
    if (panel.hidden || panel.contains(e.target) || btn.contains(e.target)) return;
    panel.hidden = true;
  });
  var save = panel.querySelector('[data-token="save"]');
  var clear = panel.querySelector('[data-token="clear"]');
  if (save) save.addEventListener('click', function () {
    var v = input ? String(input.value || '').trim() : '';
    try { v ? localStorage.setItem(KEY, v) : localStorage.removeItem(KEY); } catch (e) {}
    panel.hidden = true;
  });
  if (clear) clear.addEventListener('click', function () {
    try { localStorage.removeItem(KEY); } catch (e) {}
    if (input) input.value = '';
  });
})();

/* 转义唯一出口 */
function esc(v) {
  return String(v === null || v === undefined ? '' : v)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

/* fetch 包装：同源注入 X-App-Token；Headers 实例先展开（审查 Low#7 同修） */
(function () {
  var orig = window.fetch ? window.fetch.bind(window) : null;
  if (!orig) return;
  window.fetch = function (input, init) {
    var tok = '';
    try { tok = localStorage.getItem('appToken') || ''; } catch (e) {}
    if (!tok) return orig(input, init);
    var url = typeof input === 'string' ? input : ((input && input.url) || String(input || ''));
    var same;
    try { same = new URL(url, location.href).origin === location.origin; } catch (e) { same = false; }
    if (!same) return orig(input, init);
    var h = (init && init.headers) || {};
    var o = {}, has = false, k;
    if (typeof Headers !== 'undefined' && h instanceof Headers) {
      h.forEach(function (v, k2) { o[k2] = v; });
    } else { for (k in h) { o[k] = h[k]; } }
    for (k in o) { if (k.toLowerCase() === 'x-app-token') has = true; }
    if (!has) o['X-App-Token'] = tok;
    return orig(input, { ...(init || {}), headers: o });
  };
})();

var authToastTimer = null, rateNoted = false;
function toastOnce(kind, msg) {
  if (kind === '429') { if (rateNoted) return; rateNoted = true; }
  var t = document.getElementById('authToast');
  if (!t) return;
  t.textContent = msg; t.hidden = false;
  clearTimeout(authToastTimer);
  authToastTimer = setTimeout(function () { t.hidden = true; }, 4200);
}
function story(target, text, cls) {
  var box = document.getElementById(target);
  if (!box) return;
  var d = document.createElement('div');
  d.className = 'storyline' + (cls ? ' ' + cls : '');
  d.textContent = (typeof text === 'string') ? text : JSON.stringify(text);
  box.appendChild(d);
  box.scrollTop = box.scrollHeight;
}
function storyClear(target) {
  var box = document.getElementById(target);
  if (box) box.textContent = '';
}
function hhmm(h) {
  var v = Number(h);
  if (!isFinite(v)) return '—';
  var hh = Math.floor(v), mm = Math.round((v - hh) * 60);
  return (hh < 10 ? '0' : '') + hh + ':' + (mm < 10 ? '0' : '') + mm;
}

/* ===== 全局状态 ===== */
var S = {
  city: '', detected: '', spots: [], kept: [],      // kept: 与 S.spots 同索引的布尔
  taskId: null, result: null, days: [],             // days: [{name, stay_min|null}]（当前编排）
  activeDay: 1, pref: 'balanced', rob: '0',
  map: null, mapDrawer: null, tileCfg: null, busy: false
};
var $ = function (id) { return document.getElementById(id); };

/* ===== 启动：城市表 ===== */
fetch('/cities').then(function (r) { return r.json(); }).then(function (d) {
  var dl = $('p2CityList');
  if (!dl || !d || !Array.isArray(d.cities)) return;
  d.cities.forEach(function (c) {
    var o = document.createElement('option'); o.value = c; dl.appendChild(o);
  });
}).catch(function () {});

/* ===== 抽取：自由文本统一入口 ===== */
async function doExtract() {
  if (S.busy) return;
  var text = ($('p2-text') && $('p2-text').value || '').trim();
  if (!text) { story('p2-story', '先贴攻略或写一句话，比如「成都两天带娃」。', 'err'); return; }
  S.busy = true;
  var go = $('p2-go'); if (go) go.disabled = true;
  storyClear('p2-story');
  story('p2-story', '正在读你的文本，抽景点、对齐高德坐标…');
  try {
    var r = await fetch('/extract', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: text, city: S.city || '' })
    });
    if (r.status === 429) { toastOnce('429', '请求过于频繁，请稍后再试'); return; }
    if (r.status === 401) { toastOnce('401', '访问令牌无效，请在右上角填入'); return; }
    var d = await r.json();
    if (!r.ok) throw new Error((d && d.detail) || ('HTTP ' + r.status));
    S.spots = Array.isArray(d.spots) ? d.spots : [];
    S.kept = S.spots.map(function () { return true; });
    storyClear('p2-story');
    /* needs_city 时 resp.city 是兜底默认城市——绝不能吞进 S.city（旧版静默错误源） */
    if (d.needs_city) {
      story('p2-story', '没能确定城市——请在城市框里补一个（对齐高德必须显式城市，绝不瞎猜）。', 'err');
    } else {
      S.city = d.city || d.detected_city || S.city;
      if ($('p2-city') && S.city && !$('p2-city').value) $('p2-city').value = S.city;
    }
    var nReview = d.needs_review_count || 0;
    if (S.spots.length) {
      story('p2-story', '读到 ' + S.spots.length + ' 个候选' +
        (nReview ? '，其中 ' + nReview + ' 个拿不准（标了「待确认」，点击卡片可移除）' : '') +
        '。不想去的点一下卡片移除。', 'ok');
    } else {
      story('p2-story', '这段文本里没抽到具体景点——已打开预置库，从 ' + (S.city || '目的地') + ' 的景点里勾几个，或再贴一段攻略。');
    }
    renderCands();
    updateKept();
    if (S.spots.length < 2) openLibrary(S.city || S.detected || '');
  } catch (e) {
    if (e && (e.message === 'rate' || e.message === 'auth')) return;
    story('p2-story', '抽取失败：' + (e && e.message ? e.message : '网络异常'), 'err');
  } finally {
    S.busy = false; if (go) go.disabled = false;
  }
}

/* ===== 候选渲染与挑选 ===== */
function renderCands() {
  var box = $('p2-cands'), tools = $('p2-candtools');
  if (!box) return;
  box.textContent = '';
  box.hidden = !S.spots.length;
  if (tools) tools.hidden = !S.spots.length;
  S.spots.forEach(function (sp, i) {
    var c = document.createElement('div');
    c.className = 'cand' + (S.kept[i] ? '' : ' off');
    c.dataset.i = i;
    var name = document.createElement('div');
    name.className = 'cname';
    name.textContent = sp.name;
    c.appendChild(name);
    if (sp.desc) {
      var de = document.createElement('div');
      de.className = 'cdesc'; de.textContent = sp.desc;
      c.appendChild(de);
    }
    var meta = document.createElement('div');
    meta.className = 'cmeta';
    function m(t, cls) { var s = document.createElement('span'); s.textContent = t; if (cls) s.className = cls; meta.appendChild(s); }
    if (sp.stay_min) m('停留 ' + sp.stay_min + ' 分钟');
    if (sp.ticket_known && sp.ticket > 0) m('门票 ¥' + sp.ticket);
    else if (sp.ticket_known === false) m('票价待查');
    if (typeof sp.confidence === 'number') m('置信 ' + sp.confidence.toFixed(2));
    if (sp.needs_review) m('待确认', 'creview');
    c.appendChild(meta);
    var ck = document.createElement('span');
    ck.className = 'ck';
    ck.textContent = S.kept[i] ? '✓ 保留' : '✕ 已移除';
    c.appendChild(ck);
    box.appendChild(c);
  });
  updateKept();
}
function updateKept() {
  var n = S.kept.filter(Boolean).length;
  var el = $('p2-keptcount');
  if (el) el.textContent = '候选 ' + n;
  var go = $('p2-plan');
  if (go) go.disabled = !(n > 0 && S.city);
  /* 折叠摘要（PiTravel 模式：默认极简，参数藏起来） */
  var sum = $('p2-adjsum');
  if (sum) {
    var days = parseInt(($('p2-days') && $('p2-days').value) || '2', 10) || 2;
    var prefNames = { balanced: '均衡', less_walk: '少走路', save_money: '省钱', more_spots: '多玩' };
    sum.textContent = '行程调节 · ' + (prefNames[S.pref] || S.pref) + ' · ' + days + ' 天 · 稳妥度 ' +
      (S.rob === '0' ? '不要求' : S.rob);
  }
}
document.addEventListener('click', function (e) {
  var card = e.target && e.target.closest ? e.target.closest('.cand') : null;
  if (card) {
    var i = Number(card.dataset.i);
    S.kept[i] = !S.kept[i];
    card.classList.toggle('off', !S.kept[i]);
    var ck = card.querySelector('.ck');
    if (ck) ck.textContent = S.kept[i] ? '✓ 保留' : '✕ 已移除';
    updateKept();
    return;
  }
  var tool = e.target && e.target.closest ? e.target.closest('[data-cands]') : null;
  if (tool) {
    var mode = tool.dataset.cands;
    if (mode === 'all') S.kept = S.spots.map(function () { return true; });
    else if (mode === 'none') S.kept = S.spots.map(function () { return false; });
    else if (mode === 'lib') { openLibrary(S.city); return; }
    renderCands();
  }
});

/* ===== 预置库补充 ===== */
function openLibrary(city) {
  var det = $('p2-lib');
  if (!det || !city) return;
  det.hidden = false;
  det.open = true;
  var chips = $('p2-libchips');
  if (!chips) return;
  chips.textContent = '加载 ' + city + ' 的预置景点…';
  fetch('/demo/spots?city=' + encodeURIComponent(city)).then(function (r) { return r.json(); })
    .then(function (d) {
      chips.textContent = '';
      var spots = Array.isArray(d.spots) ? d.spots : [];
      if (!spots.length) { chips.textContent = '该城市暂无预置数据，可换一个城市或贴攻略。'; return; }
      spots.forEach(function (sp) {
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'chip'; b.textContent = sp.name;
        b.title = (sp.desc || sp.intro || '') + (sp.stay_min ? '（建议 ' + sp.stay_min + ' 分钟）' : '');
        b.dataset.libname = sp.name;
        b.dataset.libspot = JSON.stringify(sp);
        chips.appendChild(b);
      });
    }).catch(function () { chips.textContent = '预置库加载失败。'; });
}
document.addEventListener('click', function (e) {
  var b = e.target && e.target.closest ? e.target.closest('[data-libspot]') : null;
  if (!b) return;
  var sp;
  try { sp = JSON.parse(b.dataset.libspot); } catch (err) { return; }
  // 预置库点与抽取候选去重：同名不重复入列
  if (S.spots.some(function (x) { return x.name === sp.name; })) return;
  S.spots.push(sp);
  S.kept.push(true);
  renderCands();
  b.disabled = true; b.style.opacity = '.45';
});

/* ===== 生成行程 ===== */
function doPlan() {
  if (S.busy) return;
  var city = ($('p2-city') && $('p2-city').value || '').trim();
  var kept = S.spots.filter(function (s, i) { return S.kept[i]; });
  if (!city) { story('p2-progress', '先填城市——对齐高德必须显式城市。', 'err'); return; }
  if (!kept.length) { story('p2-progress', '至少保留一个候选点。', 'err'); return; }
  S.city = city;
  var days = parseInt(($('p2-days') && $('p2-days').value) || '2', 10);
  days = Math.max(1, Math.min(7, days || 2));
  var budget = ($('p2-budget') && $('p2-budget').value || '').trim();
  var t = ($('p2-start') && $('p2-start').value || '09:00').split(':');
  var te = ($('p2-end') && $('p2-end').value || '18:00').split(':');
  S.date = ($('p2-date') && $('p2-date').value) || '';
  var req = {
    city: city, days: days,
    daily_start_h: (parseInt(t[0], 10) || 9) + (parseInt(t[1], 10) || 0) / 60,
    daily_end_h: (parseInt(te[0], 10) || 18) + (parseInt(te[1], 10) || 0) / 60,
    spots: kept.map(function (s) {
      return { source_id: s.source_id, name: s.name, lat: s.lat, lon: s.lon,
               stay_min: s.stay_min || 60, score: s.score || 5,
               ticket: s.ticket || 0, ticket_known: s.ticket_known !== false,
               open_h: s.open_h || 8.0, close_h: s.close_h || 18.0, desc: s.desc || '' };
    }),
    preference: S.pref, robustness: parseFloat(S.rob) || 0
  };
  if (budget) req.budget = parseFloat(budget) || undefined;
  S.busy = true;
  var btn = $('p2-plan'); if (btn) btn.disabled = true;
  storyClear('p2-progress');
  story('p2-progress', '求解器接管：时间窗 / 预算 / 通勤全由确定性算法保证——');
  fetch('/plan/async', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(req)
  }).then(function (r) {
    if (r.status === 429) { toastOnce('429', '请求过于频繁，请稍后再试'); throw new Error('rate'); }
    if (r.status === 401) { toastOnce('401', '访问令牌无效，请在右上角填入'); throw new Error('auth'); }
    return r.json().then(function (d) {
      if (!r.ok) throw new Error((d && d.detail) || ('HTTP ' + r.status));
      return d;
    });
  }).then(function (d) {
    S.taskId = d.task_id;
    return poll(d.task_id, 'p2-progress', function (snap) { S.result = snap.result; });
  }).then(function (snap) {
    if (!snap || !snap.result) { story('p2-progress', '任务失败：' + (snap && snap.error ? snap.error : '未知') + '。可调整候选后重试。', 'err'); return; }
    S.days = snap.result.days.map(function (day) {
      return day.spots.map(function (s) { return { name: s.name, stay_min: null }; });
    });
    S.activeDay = 1;
    renderResult(snap.result);
    story('p2-progress', '行程已生成。点时间线卡片上的按钮微调，或在下方对话框里用一句话改。', 'ok');
    if (S.date) weatherTool(S.date, days);   // 天气工具：有日期就自动调用（agent 工具层）
  }).catch(function (e) {
    if (e && (e.message === 'rate' || e.message === 'auth')) return;
    story('p2-progress', '排期失败：' + (e && e.message ? e.message : '网络异常'), 'err');
  }).then(function () {
    S.busy = false; if (btn) btn.disabled = false;
  });
}

/* ===== 轮询（900ms，进度进叙事）===== */
function poll(taskId, storyId, onDone) {
  var n = 0;
  return new Promise(function (resolve, reject) {
    function tick() {
      fetch('/task/' + encodeURIComponent(taskId)).then(function (r) { return r.json(); })
        .then(function (snap) {
          if (storyId) {
            var box = $(storyId);
            if (box && Array.isArray(snap.progress) && snap.progress.length) {
              var last = snap.progress[snap.progress.length - 1];
              if (box.dataset.last !== last) { box.dataset.last = last; story(storyId, last); }
            }
          }
          if (snap.status === 'completed' || snap.status === 'failed') {
            if (onDone) onDone(snap);        // 结果交还调用方（planner2_smoke 抓的真 bug：
            resolve(snap); return;           //  形参死代码 ⇒ S.result 停旧值，天 tab 静默失效）
          }
          if (++n > 150) { resolve({ status: 'failed', error: '超时' }); return; }
          setTimeout(tick, 900);
        }).catch(reject);
    }
    tick();
  });
}

/* ===== 结果渲染 ===== */
function renderResult(result) {
  var box = $('p2-result');
  if (!box || !result) return;
  box.textContent = '';
  var chat = $('p2-editchat'); if (chat) chat.hidden = false;

  /* 天 tab：每天 + 全部 */
  var tabs = document.createElement('div');
  tabs.className = 'daytabs';
  var labels = result.days.map(function (d) { return '第 ' + d.day + ' 天'; });
  labels.push('全部');
  labels.forEach(function (lab, idx) {
    var b = document.createElement('button');
    b.type = 'button';
    var on = (idx === labels.length - 1) ? S.activeDay === 0 : (idx + 1) === S.activeDay;
    b.className = 'daytab' + (on ? ' on' : '');
    b.dataset.day = (idx === labels.length - 1) ? '0' : String(idx + 1);
    b.textContent = lab;
    tabs.appendChild(b);
  });
  box.appendChild(tabs);

  /* 时间线（活动天） */
  var day = result.days.filter(function (d) { return d.day === S.activeDay; })[0];
  var tl = document.createElement('div');
  tl.className = 'tl';
  if (day) {
    day.spots.forEach(function (s, i) {
      var row = document.createElement('div');
      row.className = 'tl-row';
      var tm = document.createElement('span');
      tm.className = 'tl-time';
      tm.textContent = hhmm(s.arrive_h) + '–' + hhmm(s.depart_h);
      row.appendChild(tm);
      var mid = document.createElement('div');
      var nm = document.createElement('div');
      nm.className = 'tl-name'; nm.textContent = (i + 1) + '. ' + s.name;
      mid.appendChild(nm);
      if (s.desc) { var de = document.createElement('div'); de.className = 'tl-desc'; de.textContent = s.desc; mid.appendChild(de); }
      row.appendChild(mid);
      var right = document.createElement('div');
      right.style.textAlign = 'right';
      var tk = document.createElement('div');
      tk.className = 'tl-ticket' + (s.ticket_known ? '' : ' unknown');
      tk.textContent = s.ticket_known ? (s.ticket > 0 ? '¥' + s.ticket : '免费') : '票价待查';
      right.appendChild(tk);
      /* 编辑钮：移除 / ±15 / 移到（全编辑=结构化 recheck） */
      var ops = document.createElement('div');
      ops.className = 'tl-ops';
      function op(t, act, cls) {
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'tlop' + (cls ? ' ' + cls : '');
        b.dataset.act = act; b.dataset.name = s.name; b.textContent = t;
        return b;
      }
      ops.appendChild(op('✕ 移除', 'remove', 'danger'));
      ops.appendChild(op('−15', 'stay-15'));
      ops.appendChild(op('+15', 'stay+15'));
      for (var d2 = 1; d2 <= result.days.length; d2++) {
        if (d2 !== S.activeDay) ops.appendChild(op('→ 第' + d2 + '天', 'move:' + d2));
      }
      right.appendChild(ops);
      row.appendChild(right);
      tl.appendChild(row);
    });
    var foot = document.createElement('div');
    foot.className = 'tl-dayfoot';
    foot.textContent = '第 ' + day.day + ' 天 · 通勤 ' + Math.round(day.commute_min) + ' 分钟 · 门票 ¥' +
      Math.round(day.cost) + ' · 游玩 ' + Math.round(day.active_min) + ' 分钟';
    tl.appendChild(foot);
  }
  box.appendChild(tl);

  /* 总览条 */
  var totals = document.createElement('div');
  totals.className = 'totals';
  function chip(t, cls) { var s = document.createElement('span'); if (cls) s.className = cls; s.textContent = t; totals.appendChild(s); }
  chip('总门票 ¥' + Math.round(result.total_cost) + (result.cost_known ? '' : '（已知部分之和）'),
       result.cost_known ? '' : 'warn');
  chip('行程分 ' + Number(result.total_score).toFixed(2));
  chip('共 ' + result.days.length + ' 天');
  if (result.unplanned && result.unplanned.length) chip('未能排入 ' + result.unplanned.length, 'warn');
  var st = result.check_report && result.check_report.stats;
  if (st && typeof st.spots_planned === 'number') chip('校验通过 · 已排 ' + st.spots_planned);
  box.appendChild(totals);

  /* 未排入（原因透明） */
  if (result.unplanned && result.unplanned.length) {
    var up = document.createElement('div');
    up.className = 'unplanned';
    result.unplanned.forEach(function (u) {
      var s = document.createElement('span');
      s.textContent = u.name + '：' + u.reason;
      up.appendChild(s);
    });
    box.appendChild(up);
  }

  /* 天 tab 事件 + 地图 */
  bindDayTabs(box);
  drawMap();
}

function bindDayTabs(box) {
  var tabs = box.querySelectorAll('.daytab');
  Array.prototype.forEach.call(tabs, function (b) {
    b.addEventListener('click', function () {
      S.activeDay = Number(b.dataset.day) || 0;
      renderResult(S.result);
    });
  });
}

/* ===== 天气工具（2026 agent 层）：行程日期确定 → 自动调用 /weather ===== */
function weatherTool(startDate, days) {
  var d0 = new Date(startDate + 'T00:00:00');
  var d1 = new Date(d0.getTime() + (days - 1) * 86400000);
  var isoDate = function (d) { return d.toISOString().slice(0, 10); };
  fetch('/weather?city=' + encodeURIComponent(S.city) + '&start=' + isoDate(d0) + '&end=' + isoDate(d1))
    .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
    .then(function (res) {
      if (!res.ok || !res.d || res.d.available === false) {
        story('p2-progress', '天气没拿到' + (res.d && res.d.reason ? '（' + res.d.reason + '）' : '') + '——不影响行程。');
        return;
      }
      var daysArr = Array.isArray(res.d.days) ? res.d.days : [];
      if (!daysArr.length) return;
      var box = $('p2-result');
      if (!box) return;
      var w = document.createElement('div');
      w.className = 'totals';
      daysArr.forEach(function (wd) {
        var s = document.createElement('span');
        s.textContent = (wd.date || '') + ' ' + (wd.temp || '') + ' ' + (wd.desc || wd.weather || '');
        w.appendChild(s);
      });
      box.insertBefore(w, box.firstChild.nextSibling);   // 天 tab 之后
    }).catch(function () { /* 天气是注脚：失败不影响行程 */ });
}

/* ===== 结构化编辑（/plan/recheck：服务端全量重算）===== */
function applyEdit(name, act) {
  if (!S.days.length || S.busy) return;
  if (act === 'remove') {
    S.days = S.days.map(function (day) {
      return day.filter(function (r) { return r.name !== name; });
    }).filter(function (day) { return day.length > 0; });
    if (!S.days.length) { story('p2-progress', '全部移除等于重开——先用候选区挑点。', 'err'); return; }
  } else if (act === 'stay+15' || act === 'stay-15') {
    var delta = act === 'stay+15' ? 15 : -15;
    var origStay = 60;
    S.spots.forEach(function (x) { if (x.name === name && x.stay_min) origStay = x.stay_min; });
    S.days = S.days.map(function (day) {
      return day.map(function (r) {
        if (r.name !== name) return r;
        /* 基准 = 用户已改的值，否则取**原始候选**的 stay_min
           （VisitedSpot 没有停留字段，从 result 里取是错的） */
        var cur = (typeof r.stay_min === 'number') ? r.stay_min : origStay;
        return { name: r.name, stay_min: Math.max(30, Math.min(480, cur + delta)) };
      });
    });
  } else if (act.indexOf('move:') === 0) {
    var target = parseInt(act.slice(5), 10);
    var moved = null;
    S.days = S.days.map(function (day, idx) {
      if (idx + 1 === S.activeDay) {
        moved = day.filter(function (r) { return r.name === name; })[0] || null;
        return day.filter(function (r) { return r.name !== name; });
      }
      return day;
    });
    if (moved && S.days[target - 1]) S.days[target - 1].push(moved);
  }
  recheck();
}
function flattenSpots() {
  var out = [];
  (S.result ? S.result.days : []).forEach(function (d) {
    d.spots.forEach(function (s) { out.push(s); });
  });
  return out;
}
function recheck() {
  if (!S.taskId) return;
  var day_specs = S.days.map(function (day) {
    return { spots: day.map(function (r) {
      var row = { name: r.name };
      if (typeof r.stay_min === 'number') row.stay_min = r.stay_min;
      return row;
    }) };
  }).filter(function (day) { return day.spots.length > 0; });
  if (!day_specs.length) { story('p2-progress', '全部移除等于重开——先用候选区挑点。', 'err'); return; }
  S.busy = true;
  fetch('/plan/recheck', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ task_id: S.taskId, days: day_specs })
  }).then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
    .then(function (res) {
      if (!res.ok) { story('p2-progress', '重排失败：' + ((res.d && res.d.detail) || '未知'), 'err'); return; }
      var snap = res.d;
      if (snap.result) {
        S.result = snap.result;
        S.days = snap.result.days.map(function (day) {
          return day.spots.map(function (s) { return { name: s.name, stay_min: null }; });
        });
        if (S.activeDay > snap.result.days.length) S.activeDay = snap.result.days.length;
        renderResult(S.result);
      }
    }).catch(function (e) {
      story('p2-progress', '重排失败：' + (e && e.message ? e.message : '网络异常'), 'err');
    }).then(function () { S.busy = false; });
}

/* ===== 对话改行程（/plan/edit：LLM 解析 → 确定性执行）===== */
function doEditChat() {
  if (S.busy || !S.taskId) return;
  var inp = $('p2-editinput');
  var text = (inp && inp.value || '').trim();
  if (!text) return;
  S.busy = true;
  var btn = $('p2-editsend'); if (btn) btn.disabled = true;
  if (inp) inp.value = '';
  story('p2-progress', '对话编辑：「' + text + '」——LLM 解析意图，确定性执行…');
  fetch('/plan/edit', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ task_id: S.taskId, instruction: text, memory: [] })
  }).then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
    .then(function (res) {
      if (!res.ok) { story('p2-progress', '对话编辑不可用：' + ((res.d && res.d.detail) || '未知'), 'err'); return; }
      return poll(res.d.task_id, 'p2-progress', function (snap) { S.result = snap.result; })
        .then(function (snap) {
          if (snap.status !== 'completed' || !snap.result) {
            story('p2-progress', '对话编辑失败：' + (snap.error || '未知'), 'err'); return;
          }
          S.taskId = res.d.task_id;
          S.result = snap.result;
          S.days = snap.result.days.map(function (day) {
            return day.spots.map(function (s) { return { name: s.name, stay_min: null }; });
          });
          if (S.activeDay > snap.result.days.length) S.activeDay = snap.result.days.length;
          renderResult(S.result);
          story('p2-progress', '改好了。继续微调或换天都可以。', 'ok');
        });
    }).catch(function (e) {
      story('p2-progress', '对话编辑失败：' + (e && e.message ? e.message : '网络异常'), 'err');
    }).then(function () { S.busy = false; if (btn) btn.disabled = false; });
}

/* ===== 地图（桌面常驻 / 移动抽屉；Leaflet + 高德瓦片）===== */
function ensureMap(containerId) {
  if (!window.L) return null;                       // jsdom/无 vendor 环境：守卫不报错
  var el = document.getElementById(containerId);
  if (!el) return null;
  var key = containerId;
  if (!S.map) S.map = {};
  if (S.map[key]) { setTimeout(function () { S.map[key].invalidateSize(); }, 60); return S.map[key]; }
  var m = L.map(el, { attributionControl: false });
  if (!S.tileCfg) S.tileCfg = null;
  var cfg = S.tileCfg;
  if (!cfg) {
    // 同步拿不到就先垫 OSM（vendor 页面本就零 CDN——这里只在 /demo/config 未达时兜底）
    cfg = { tile_url: 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', subdomains: 'abc' };
  }
  L.tileLayer(cfg.tile_url, { subdomains: cfg.subdomains || 'abc', maxZoom: 18 }).addTo(m);
  S.map[key] = m;
  return m;
}
function drawMap() {
  if (!window.L) return;
  fetch('/demo/config').then(function (r) { return r.json(); }).then(function (cfg) {
    S.tileCfg = cfg;
    var m = ensureMap('p2-map');
    if (m) fillMap(m);
    if ($('p2-mapdrawer') && $('p2-mapdrawer').classList.contains('open')) {
      var dm = ensureMap('p2-map-drawer');
      if (dm) fillMap(dm);
    }
  }).catch(function () {});
}
function fillMap(m) {
  if (!window.L || !S.result) return;
  m.eachLayer(function (l) { if (l instanceof L.Marker || l instanceof L.Polyline) m.removeLayer(l); });
  var pts = [];
  var byName = {};
  S.spots.forEach(function (s) { byName[s.name] = s; });
  S.result.days.forEach(function (day) {
    if (S.activeDay !== 0 && day.day !== S.activeDay) return;
    var line = [];
    day.spots.forEach(function (s) {
      var sp = byName[s.name];
      if (!sp || typeof sp.lat !== 'number') return;
      line.push([sp.lat, sp.lon]);
      /* circleMarker 而非默认 icon：vendor 未带 marker 图片，默认图标会 404 成占位块 */
      L.circleMarker([sp.lat, sp.lon], {
        radius: 7, color: '#2563eb', weight: 2,
        fillColor: '#ffffff', fillOpacity: .9
      }).addTo(m)
        .bindPopup('<b>' + esc(s.name) + '</b><br>' + hhmm(s.arrive_h) + '–' + hhmm(s.depart_h));
    });
    if (line.length > 1) L.polyline(line, { color: '#2563eb', weight: 3, opacity: .7 }).addTo(m);
    pts = pts.concat(line);
  });
  if (pts.length) {
    var hint = document.getElementById('p2-maphint');
    if (hint) hint.remove();
  }
  if (pts.length > 1) m.fitBounds(L.latLngBounds(pts).pad(0.15));
  else if (pts.length === 1) m.setView(pts[0], 13);
}
$('p2-mapbtn') && $('p2-mapbtn').addEventListener('click', function () {
  var d = $('p2-mapdrawer');
  if (!d) return;
  d.classList.add('open');
  var m = ensureMap('p2-map-drawer');
  if (m && S.result) { fillMap(m); setTimeout(function () { m.invalidateSize(); }, 80); }
});
$('p2-mapclose') && $('p2-mapclose').addEventListener('click', function () {
  var d = $('p2-mapdrawer'); if (d) d.classList.remove('open');
});

/* ===== 事件绑定 ===== */
$('p2-go') && $('p2-go').addEventListener('click', doExtract);
$('p2-plan') && $('p2-plan').addEventListener('click', doPlan);
$('p2-editsend') && $('p2-editsend').addEventListener('click', doEditChat);
$('p2-editinput') && $('p2-editinput').addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); doEditChat(); }
});
$('p2-city') && $('p2-city').addEventListener('change', function () {
  S.city = ($('p2-city').value || '').trim();
  updateKept();
});
document.addEventListener('click', function (e) {
  var chip = e.target && e.target.closest ? e.target.closest('.chip') : null;
  if (!chip) return;
  if (chip.dataset.pref) {
    S.pref = chip.dataset.pref;
    document.querySelectorAll('#p2-pref .chip').forEach(function (c) { c.classList.toggle('on', c === chip); });
  } else if (chip.dataset.rob) {
    S.rob = chip.dataset.rob;
    document.querySelectorAll('#p2-rob .chip').forEach(function (c) { c.classList.toggle('on', c === chip); });
  }
});
/* 时间线编辑钮（事件委托） */
document.addEventListener('click', function (e) {
  var b = e.target && e.target.closest ? e.target.closest('.tlop[data-act]') : null;
  if (!b) return;
  applyEdit(b.dataset.name, b.dataset.act);
});
window.addEventListener('resize', function () {
  if (S.map) Object.keys(S.map).forEach(function (k) { S.map[k].invalidateSize(); });
});
</script>
