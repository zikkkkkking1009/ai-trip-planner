<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>AI 行程规划 · 路书</title>
<link rel="stylesheet" href="/static/vendor/leaflet.css">
<script src="/static/vendor/leaflet.js"></script>
<style>
  :root { --acc:#1677ff; --acc2:#4096ff; --fg:#1d2939; --dim:#98a2b3; --line:#e8ecf2; }
  * { box-sizing:border-box; margin:0; padding:0; font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
  body { background:#e9edf3; display:flex; justify-content:center; }
  /* App 壳：固定高度，页内滚动，底部导航常驻 */
  #phone { width:100%; max-width:460px; height:100vh; background:#f2f4f8;
           box-shadow:0 0 24px rgba(0,0,0,.10); display:flex; flex-direction:column; overflow:hidden; }
  .page { display:none; flex:1; overflow-y:auto; overscroll-behavior:contain; }
  .page.active { display:block; }
  header { background:linear-gradient(135deg,#3d9bff 0%,#1677ff 100%); color:#fff;
           padding:24px 20px 44px; border-radius:0 0 20px 20px; }
  header h1 { font-size:21px; font-weight:800; }
  header .meta { opacity:.92; font-size:12.5px; margin-top:5px; }
  header .chips { margin-top:10px; display:flex; gap:8px; flex-wrap:wrap; }
  header .chip { background:rgba(255,255,255,.2); padding:4px 12px; border-radius:12px; font-size:12px; }
  .sheet { background:#fff; border-radius:14px; margin:-28px 14px 12px; padding:14px;
           box-shadow:0 6px 18px rgba(22,119,255,.10); }
  .field { display:flex; flex-direction:column; gap:4px; }
  .field label { font-size:11px; color:#8a94a6; }
  .datefield { margin-bottom:10px; cursor:pointer; }
  .datebox { display:flex; justify-content:space-between; align-items:center;
             border:1px solid var(--line); background:#f8fafc; border-radius:9px; padding:10px 12px; }
  .datebox b { font-size:15px; color:var(--fg); font-variant-numeric:tabular-nums; }
  .datebox .nights { color:var(--acc); font-size:12px; font-weight:700; }
  .grid3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
  input { border:1px solid var(--line); background:#f8fafc; border-radius:9px;
          padding:9px 10px; width:100%; color:var(--fg); font-size:14px; }
  input:focus { outline:none; border-color:var(--acc); background:#fff; }
  .go { margin-top:10px; width:100%; background:linear-gradient(90deg,#4096ff,#1677ff); color:#fff;
        border:none; border-radius:10px; padding:11px; font-size:15px; font-weight:700;
        cursor:pointer; letter-spacing:2px; }
  .go:disabled { opacity:.5; }
  /* 分段控件 + Day tabs：吸顶 */
  .seg { display:flex; background:#fff; border-radius:10px; margin:8px 14px; padding:3px;
         box-shadow:0 1px 6px rgba(22,119,255,.08); position:sticky; top:0; z-index:420; }
  .seg .s { flex:1; text-align:center; padding:8px 0; font-size:13.5px; color:var(--dim);
            border-radius:8px; cursor:pointer; }
  .seg .s.active { background:#e8f1ff; color:var(--acc); font-weight:700; }
  .daytabs { display:flex; gap:4px; padding:0 12px; background:#fff; overflow-x:auto;
             scrollbar-width:none; position:sticky; top:44px; z-index:410;
             border-bottom:1px solid var(--line); }
  .daytabs::-webkit-scrollbar { display:none; }
  .daytabs .tab { padding:11px 12px; font-size:14px; color:var(--dim); cursor:pointer;
                  white-space:nowrap; border-bottom:2.5px solid transparent; }
  .daytabs .tab.active { color:var(--fg); font-weight:800; border-bottom-color:var(--acc); }
  /* 行程卡片 */
  #view { padding:8px 16px 24px; }
  .dayblock { background:#fff; border-radius:14px; padding:14px; margin-bottom:14px;
              box-shadow:0 2px 10px rgba(22,119,255,.06); }
  .dayhead { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; }
  .daytitle { font-size:17px; font-weight:800; }
  .daysub { color:var(--dim); font-size:11.5px; }
  .entry { display:flex; gap:11px; padding:9px 0; border-top:1px dashed #eef1f5; }
  .entry:first-of-type { border-top:none; }
  .entry .bar { width:4px; border-radius:2px; flex-shrink:0; }
  .entry .img { width:56px; height:56px; border-radius:9px; object-fit:cover; flex-shrink:0; background:#eef1f5; }
  .entry .body { flex:1; min-width:0; }
  .entry .toprow { display:flex; align-items:baseline; gap:6px; }
  .entry .tag { color:#2f9e44; font-size:10.5px; }
  .entry .name { font-size:15.5px; font-weight:700; cursor:pointer; }
  .entry .name:active { color:var(--acc); }
  .entry .ticket { color:#e8590c; font-size:11.5px; }
  .entry .time { display:inline-block; background:#f0f4fa; border-radius:8px;
                 padding:5px 11px; margin:6px 0 4px; font-size:13.5px; font-weight:700;
                 font-variant-numeric:tabular-nums; }
  .entry .desc { color:#667085; font-size:12.5px; line-height:1.65; }
  .entry .intro { color:var(--dim); font-size:11.5px; margin-top:2px; }
  .fav { align-self:center; background:none; border:none; font-size:20px; cursor:pointer; flex-shrink:0; padding:4px; }
  .unplanned { background:#fff4f4; color:#c0392b; font-size:12px; padding:7px 12px;
               border-radius:9px; margin-bottom:8px; }
  .changes { background:#eef6ee; border:1px solid #cde8cf; color:#2b6e34;
             font-size:12.5px; border-radius:10px; padding:8px 12px; margin-bottom:10px; }
  /* 地图 */
  #mapView { padding:8px 14px 24px; position:relative; }
  #map { height:56vh; min-height:360px; width:100%; border-radius:14px; }
  .legend { position:absolute; top:20px; right:24px; z-index:500; background:#fff;
            border-radius:10px; padding:8px 12px; font-size:12px; box-shadow:0 2px 10px rgba(0,0,0,.18); }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:5px; }
  .legend div { margin:3px 0; cursor:pointer; }
  .legend div.off { opacity:.35; }
  .maptip { color:var(--dim); font-size:11.5px; text-align:center; margin-top:8px; }
  .empty-hint { position:absolute; top:44%; left:50%; transform:translate(-50%,-50%);
                z-index:500; background:#fff; border-radius:12px; padding:14px 20px;
                font-size:13px; color:#667085; text-align:center; line-height:1.9;
                box-shadow:0 4px 16px rgba(22,119,255,.15); }
  /* 日志 + 对话框 */
  details { margin:0 14px 8px; }
  summary { color:var(--dim); font-size:12px; cursor:pointer; }
  #log { max-height:150px; overflow-y:auto; font-size:12px; line-height:1.9; color:#555;
         background:#fff; border-radius:8px; padding:8px 12px; }
  #log .st { color:var(--acc); }
  .chatbar { display:flex; gap:8px; padding:10px 14px; background:#f2f4f8;
             position:sticky; bottom:0; z-index:430; }
  .chatbar input { flex:1; box-shadow:0 2px 10px rgba(22,119,255,.08); }
  .chatbar button { background:var(--acc); color:#fff; border:none; border-radius:9px;
                    padding:8px 16px; cursor:pointer; font-size:13px; font-weight:600; }
  .chatbar button:disabled { opacity:.5; }
  /* ===== 我的 ===== */
  .usection { background:#fff; border-radius:14px; margin:14px; padding:16px;
              box-shadow:0 2px 10px rgba(22,119,255,.06); }
  .usection h2 { font-size:15px; font-weight:800; margin-bottom:12px; }
  .ucard { display:flex; gap:12px; padding:10px 0; border-top:1px dashed #eef1f5;
           cursor:pointer; align-items:center; }
  .ucard:first-of-type { border-top:none; }
  .ucard .info { flex:1; min-width:0; }
  .ucard .t { font-size:15px; font-weight:700; }
  .ucard .s { color:var(--dim); font-size:12px; margin-top:3px; }
  .ucard .del { background:none; border:none; color:#e03131; font-size:16px; cursor:pointer; padding:6px; }
  .uempty { color:var(--dim); font-size:13px; text-align:center; padding:18px 0; }
  /* ===== 底部主导航（常驻） ===== */
  .bottombar { flex-shrink:0; background:#fff; display:flex;
               border-top:1px solid var(--line); z-index:600; }
  .bottombar .b { flex:1; text-align:center; padding:9px 0 11px; font-size:13.5px;
                  color:var(--dim); cursor:pointer; }
  .bottombar .b.active { color:var(--acc); font-weight:700; }
  /* ===== 日历弹层 ===== */
  .cal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:950;
                 display:flex; align-items:flex-end; justify-content:center; }
  .cal-sheet { width:100%; max-width:460px; background:#fff; border-radius:18px 18px 0 0;
               max-height:86vh; display:flex; flex-direction:column; }
  .cal-head { padding:14px 16px 8px; display:flex; justify-content:space-between; align-items:center; }
  .cal-head b { font-size:16px; }
  .cal-week { display:grid; grid-template-columns:repeat(7,1fr); text-align:center;
              color:var(--dim); font-size:12px; padding:6px 8px; border-bottom:1px solid var(--line); }
  .cal-week span:first-child, .cal-week span:last-child { color:#e8590c; }
  .cal-months { overflow-y:auto; flex:1; padding:0 8px 8px; }
  .cal-title { font-size:15px; font-weight:800; padding:14px 10px 6px; }
  .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); }
  .cal-cell { height:48px; display:flex; align-items:center; justify-content:center; }
  .cal-cell .d { width:36px; height:36px; display:flex; align-items:center; justify-content:center;
                 border-radius:9px; font-size:14.5px; font-variant-numeric:tabular-nums; }
  .cal-cell.dis .d { color:#ccd3dc; pointer-events:none; }
  .cal-cell .d.today { box-shadow:inset 0 0 0 1px var(--acc); color:var(--acc); }
  .cal-cell .d.start, .cal-cell .d.end { background:var(--acc); color:#fff; font-weight:700; }
  .cal-cell .d.inrange { background:#e8f1ff; color:var(--acc); border-radius:0; }
  .cal-cell .d.start.inrange { border-radius:9px 0 0 9px; }
  .cal-cell .d.end.inrange { border-radius:0 9px 9px 0; }
  .cal-foot { padding:10px 14px 14px; border-top:1px solid var(--line); }
  .cal-foot button { width:100%; background:var(--acc); color:#fff; border:none; border-radius:10px;
                     padding:12px; font-size:15px; font-weight:700; cursor:pointer; }
  .cal-foot button:disabled { opacity:.4; }
</style>
</head>
<body>
<div id="phone">

  <!-- ========= 页面一：规划 ========= -->
  <div class="page active" id="pagePlan">
    <header>
      <h1>AI 行程规划</h1>
      <div class="meta">LLM 抽取 → 实体对齐 → OPTW 求解 → 约束校验</div>
      <div class="chips" id="chips">
        <span class="chip">🎒 高德真实通勤</span>
        <span class="chip">🧭 三级缓存</span>
        <span class="chip">✅ 约束校验</span>
      </div>
    </header>

    <div class="sheet">
      <div class="field datefield" onclick="openCalendar()">
        <label>行程日期</label>
        <div class="datebox">
          <b id="dateText">--</b><span class="nights" id="nightsText"></span><span>📅</span>
        </div>
      </div>
      <input type="hidden" id="startDate">
      <input type="hidden" id="endDate">
      <div class="field datefield" onclick="openHotelPicker()">
        <label>住宿酒店</label>
        <div class="datebox">
          <b id="hotelText">未设置（点此搜索选择）</b><span>🏨</span>
        </div>
      </div>
      <div class="grid3">
        <div class="field"><label>每天出发</label><input id="start" type="time" value="09:00"></div>
        <div class="field"><label>每天返回</label><input id="end" type="time" value="18:00"></div>
        <div class="field"><label>预算(空=不限)</label><input id="budget" type="number" value="500"></div>
      </div>
      <button class="go" id="go">开 始 规 划</button>
    </div>

    <details><summary>求解进度日志</summary><div id="log">等待任务…</div></details>

    <div class="daytabs" id="daytabs" style="display:none"></div>
    <div class="seg" id="viewSeg" style="display:none">
      <div class="s active" onclick="switchView('itin')">📋 行程</div>
      <div class="s" onclick="switchView('map')">🗺 地图</div>
    </div>
    <div id="view"></div>
    <div id="mapView" style="display:none"><div id="map"></div><div class="legend" id="legend"></div>
      <div class="empty-hint" id="mapEmpty">还没有行程 —— 点「开始规划」<br>生成后这里会画出按天分色的路线</div>
      <div class="maptip">路线为景点连线示意 · 底图数据 © 高德地图</div></div>

    <div class="chatbar" id="chatbar" style="display:none">
      <input id="chatInput" placeholder="例如：把回民街换成咖啡店 / 住未央区的酒店"
             onkeydown="if(event.key==='Enter')sendEdit()">
      <button id="chatSend" onclick="sendEdit()">发送</button>
    </div>
  </div>

  <!-- ========= 页面二：我的 ========= -->
  <div class="page" id="pageUser">
    <header style="padding-bottom:24px">
      <h1>我的</h1>
      <div class="meta">历史规划与收藏的景点</div>
    </header>
    <div class="usection">
      <h2>🕘 历史规划</h2>
      <div id="plansList"><div class="uempty">加载中…</div></div>
    </div>
    <div class="usection">
      <h2>⭐ 收藏的景点</h2>
      <div id="favsList"><div class="uempty">加载中…</div></div>
    </div>
  </div>

  <div class="bottombar">
    <div class="b active" onclick="switchPage('plan')">🧭 规划</div>
    <div class="b" onclick="switchPage('user')">👤 我的</div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const DAY_COLORS = ['#2f9e44','#f08c00','#7048e8','#1c7ed6','#e8590c','#0ca678','#ae3ec9'];
const WD = ['周日','周一','周二','周三','周四','周五','周六'];
let spots = [], plan = null, currentDay = 0, map = null, layers = {}, dayOn = {};
let lastTaskId = null, favSet = new Set();

// ---- 默认日期：今天起 3 天 ----
function iso(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
const today = new Date(); const de = new Date(today); de.setDate(de.getDate()+2);
$('startDate').value = iso(today); $('endDate').value = iso(de);
refreshDateBox();
fetch('/demo/spots').then(r => r.json()).then(d => { spots = d.spots; });
loadFavorites();  // 启动即同步收藏状态，星标不再滞后

window.onerror = (msg, src, line) => log('前端错误', `${msg} @line ${line}`);

// 底图可配置：默认高德瓦片（GCJ-02）；TILE_PROVIDER=osm 时后端下发 OSM 配置
let tileCfg = { tile_url: 'https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}',
                subdomains: '1234', attribution: '© 高德地图', gcj: true };
fetch('/demo/config').then(r => r.json()).then(c => { tileCfg = c;
  const mt = document.querySelector('.maptip');
  if (mt) mt.textContent = '路线为景点连线示意 · 底图数据 ' + c.attribution;
  if (map) { map.remove(); map = null; layers = {}; renderMap(); } });

// ---- GCJ-02(高德) → WGS84(OSM)，eviltransform 标准算法（仅 OSM 底图时使用）----
function gcj2wgs(lat, lon) {
  if (lon < 72.004 || lon > 137.8347 || lat < 0.8293 || lat > 55.8271) return [lat, lon];
  const tLat = (x,y) => -100 + 2*x + 3*y + .2*y*y + .1*x*y + .2*Math.sqrt(Math.abs(x))
    + (20*Math.sin(6*x*Math.PI) + 20*Math.sin(2*x*Math.PI))*2/3
    + (20*Math.sin(y*Math.PI) + 40*Math.sin(y/3*Math.PI))*2/3
    + (160*Math.sin(y/12*Math.PI) + 320*Math.sin(y*Math.PI/30))*2/3;
  const tLon = (x,y) => 300 + x + 2*y + .1*x*x + .1*x*y + .1*Math.sqrt(Math.abs(x))
    + (20*Math.sin(6*x*Math.PI) + 20*Math.sin(2*x*Math.PI))*2/3
    + (20*Math.sin(x*Math.PI) + 40*Math.sin(x/3*Math.PI))*2/3
    + (150*Math.sin(x/12*Math.PI) + 300*Math.sin(x/30*Math.PI))*2/3;
  let dLat = tLat(lon-105, lat-35), dLon = tLon(lon-105, lat-35);
  const rad = lat/180*Math.PI; let m = Math.sin(rad); m = 1 - .00669342162296594*m*m;
  const sq = Math.sqrt(m);
  dLat = (dLat*180) / ((6378245*(1-.00669342162296594))/(m*sq)*Math.PI);
  dLon = (dLon*180) / (6378245/sq*Math.cos(rad)*Math.PI);
  return [lat - dLat, lon - dLon];
}
const fmt = h => { const hh=Math.floor(h), mm=Math.round((h-hh)*60);
  return String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0'); };
const dateOf = i => { const d = new Date($('startDate').value || Date.now());
  d.setDate(d.getDate()+i);
  return `${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} ${WD[d.getDay()]}`; };
function dayCount() {
  const s = new Date($('startDate').value), e = new Date($('endDate').value);
  return Math.max(1, Math.min(7, Math.round((e - s)/86400000) + 1));
}
const timeToH = t => { const [h,m] = t.split(':').map(Number); return h + m/60; };
function refreshDateBox() {
  const s = new Date($('startDate').value), e = new Date($('endDate').value);
  const f = d => `${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
  $('dateText').textContent = `${f(s)} ${WD[s.getDay()]} — ${f(e)} ${WD[e.getDay()]}`;
  $('nightsText').textContent = `共${dayCount()}天`;
}

// ---- 日历弹层（先选出发日，再选结束日，区间高亮）----
let calStart = null, calEnd = null;
function openCalendar() {
  calStart = new Date($('startDate').value); calEnd = new Date($('endDate').value);
  const ov = document.createElement('div');
  ov.className = 'cal-overlay'; ov.id = 'calModal';
  ov.innerHTML = `<div class="cal-sheet">
    <div class="cal-head"><b>选择行程日期</b>
      <button onclick="this.closest('.cal-overlay').remove()" style="background:#f0f2f5;border:none;
        border-radius:50%;width:30px;height:30px;cursor:pointer">✕</button></div>
    <div class="cal-week">${['日','一','二','三','四','五','六'].map(w=>`<span>${w}</span>`).join('')}</div>
    <div class="cal-months" id="calMonths"></div>
    <div class="cal-foot"><button id="calDone" onclick="calApply()"></button></div>
  </div>`;
  ov.onclick = e => { if (e.target === ov) ov.remove(); };
  document.body.appendChild(ov);
  buildCal();
}
function buildCal() {
  const el = $('calMonths'); el.innerHTML = '';
  const base = new Date(); base.setDate(1);
  for (let m = 0; m < 3; m++) {
    const first = new Date(base.getFullYear(), base.getMonth()+m, 1);
    const title = document.createElement('div');
    title.className = 'cal-title';
    title.textContent = `${first.getFullYear()} 年 ${first.getMonth()+1} 月`;
    el.appendChild(title);
    const grid = document.createElement('div');
    grid.className = 'cal-grid';
    for (let i = 0; i < first.getDay(); i++) grid.appendChild(document.createElement('div'));
    const days = new Date(first.getFullYear(), first.getMonth()+1, 0).getDate();
    for (let day = 1; day <= days; day++) {
      const d = new Date(first.getFullYear(), first.getMonth(), day);
      const cell = document.createElement('div'); cell.className = 'cal-cell';
      const dd = document.createElement('div'); dd.className = 'd'; dd.textContent = day;
      if (d < new Date(new Date().toDateString())) cell.classList.add('dis');
      if (d.toDateString() === new Date().toDateString()) dd.classList.add('today');
      if (calStart && d.toDateString() === calStart.toDateString()) dd.classList.add('start');
      if (calEnd && d.toDateString() === calEnd.toDateString()) dd.classList.add('end');
      if (calStart && calEnd && d > calStart && d < calEnd) dd.classList.add('inrange');
      cell.onclick = () => calPick(d);
      cell.appendChild(dd); grid.appendChild(cell);
    }
    el.appendChild(grid);
  }
  updateCalFoot();
}
function calPick(d) {
  const ds = d.toDateString();
  if (calStart && calEnd) {
    // 已选完整区间：点出发日=全部取消；点结束日=只取消结束（保留出发日）
    if (ds === calStart.toDateString()) { calStart = null; calEnd = null; }
    else if (ds === calEnd.toDateString()) { calEnd = null; }
    else { calStart = d; calEnd = null; }
  } else if (calStart) {
    // 只选了出发日：再点同一天=取消；点更晚=设为结束日；点更早=改为新出发日
    if (ds === calStart.toDateString()) { calStart = null; }
    else if (d > calStart) { calEnd = d; }
    else { calStart = d; }
  } else {
    calStart = d;
  }
  buildCal();
}
function updateCalFoot() {
  const btn = $('calDone');
  if (calStart && calEnd) {
    const n = Math.round((calEnd - calStart)/86400000);
    btn.disabled = false;
    btn.textContent = `完成（${n} 晚 · ${n+1} 天）`;
  } else {
    btn.disabled = true;
    btn.textContent = calStart ? '请选择结束日期' : '请先选择出发日期';
  }
}
function calApply() {
  if (!calStart || !calEnd) return;
  $('startDate').value = iso(calStart); $('endDate').value = iso(calEnd);
  refreshDateBox();
  $('calModal').remove();
}

// ---- 底图：默认高德瓦片（GCJ-02）；TILE_PROVIDER=osm 时切 OSM + 坐标转换 ----
$('go').onclick = async () => {
  $('go').disabled = true; $('log').textContent = '';
  const req = { city:'西安', days: dayCount(),
    budget: $('budget').value==='' ? null : Number($('budget').value),
    daily_start_h: timeToH($('start').value || '09:00'),
    daily_end_h: timeToH($('end').value || '18:00'), spots };
  const {task_id, ws_url} = await fetch('/plan/async', {method:'POST',
    headers:{'Content-Type':'application/json'}, body:JSON.stringify(req)}).then(r=>r.json());
  log('任务', `task_id=${task_id}`);
  const proto = location.protocol==='https:'?'wss':'ws';
  const ws = new WebSocket(`${proto}://${location.host}${ws_url}`);
  ws.onmessage = e => { const d = JSON.parse(e.data);
    (d.progress||[]).forEach(p => log(p.stage, p.msg));
    if (d.status==='completed') { plan = d.result; lastTaskId = task_id;
      $('chatbar').style.display='flex'; render(); ws.close(); $('go').disabled=false; }
    if (d.status==='failed') { log('失败', d.error); ws.close(); $('go').disabled=false; } };
};

function log(stage, msg) {
  document.querySelector('details').open = true;
  const div = document.createElement('div');
  div.innerHTML = `<span class="st">[${stage}]</span>${msg}`;
  $('log').appendChild(div); $('log').scrollTop = 1e9;
}

// ---- 行程渲染 ----
function render() {
  const c = plan.check_report;
  $('chips').innerHTML =
    `<span class="chip">🎫 总门票 ¥${plan.total_cost}</span>` +
    `<span class="chip">📍 已排 ${c.stats.spots_planned} 个</span>` +
    (plan.hotel ? `<span class="chip">🏨 ${plan.hotel.name}</span>` : '') +
    `<span class="chip">${c.passed ? '✅ 校验通过' : '❌ 校验未过'}</span>` +
    `<span class="chip">🛰 API ${c.stats.commute_api.api_calls} 次 / 缓存 ${Math.round(c.stats.cache_hit_rate*100)}%</span>`;
  $('hotelText').textContent = plan.hotel ? plan.hotel.name : '未设置（点此搜索选择）';
  $('daytabs').style.display = 'flex';
  $('viewSeg').style.display = 'flex';
  $('daytabs').innerHTML = `<div class="tab" data-day="0">总览</div>`
    + plan.days.map((d,i)=>`<div class="tab" data-day="${i+1}">${dateOf(i).split(' ')[0]}</div>`).join('');
  document.querySelectorAll('.daytabs .tab').forEach(t =>
    t.onclick = () => { currentDay = Number(t.dataset.day);
      document.querySelectorAll('.daytabs .tab').forEach(x=>x.classList.remove('active'));
      t.classList.add('active'); renderItin(); if (map) renderMap(); });
  $('daytabs').firstChild.classList.add('active');
  renderItin();          // 规划完成立即渲染总览（这行丢过两次，不能再丢）
  switchView('itin');
}

function renderItin() {
  const v = $('view'); v.innerHTML = ''; $('mapView').style.display='none'; v.style.display='block';
  if (!plan) return;
  if (plan.reply || (plan.changes && plan.changes.length)) {
    const c = document.createElement('div');
    c.className = 'changes';
    c.textContent = plan.reply || ('本轮修改：' + plan.changes.join('；'));
    v.appendChild(c);
  }
  const days = currentDay === 0 ? plan.days : [plan.days[currentDay-1]];
  days.forEach(d => {
    const dayIdx = plan.days.indexOf(d);
    if (!d.spots.length) return;
    const blk = document.createElement('div'); blk.className='dayblock';
    blk.innerHTML = `<div class="dayhead"><div class="daytitle">${dateOf(dayIdx)}</div>
      <div class="daysub">门票 ¥${d.cost} · 通勤 ${d.commute_min} 分钟</div></div>`
      + (plan.hotel ? (() => { const hn = plan.hotel.name.replace(/'/g,"\\'"); return `<div class="entry"><div class="bar" style="background:#7048e8"></div>
          <div class="body"><div><span class="tag" style="color:#7048e8">住宿</span>
          <span class="name" style="cursor:pointer" onclick="openSpotDetail('${hn}')">🏨 ${plan.hotel.name}</span></div>
          <div class="desc">点击查看详情 · 每天从这里出发、傍晚回到这里</div></div></div>`; })() : '')
      + d.spots.map(v => {
        const color = DAY_COLORS[dayIdx % DAY_COLORS.length];
        const isFav = favSet.has(v.name);
        const img = v.image ? `<img class="img" src="${v.image}" loading="lazy" onerror="this.style.display='none'">` : '';
        const intro = v.intro ? `<div class="intro">${v.intro}</div>` : '';
        return `<div class="entry"><div class="bar" style="background:${color}"></div>${img}
          <div class="body">
          <div class="toprow"><span class="tag">景点</span>
          <span class="name" style="cursor:pointer" onclick="openSpotDetail('${v.name.replace(/'/g,"\\'")}')">${v.name}</span>
          ${v.ticket ? `<span class="ticket">¥${v.ticket}</span>` : ''}</div>
          <div class="time">${fmt(v.arrive_h)} – ${fmt(v.depart_h)}</div>
          ${v.desc ? `<div class="desc">${v.desc}</div>` : ''}${intro}</div>
          <button class="fav" title="收藏" onclick="toggleFav('${v.name.replace(/'/g,"\\'")}')">${isFav?'⭐':'☆'}</button></div>`; }).join('');
    v.appendChild(blk);
  });
  if (currentDay === 0)
    plan.unplanned.forEach(u => { const p=document.createElement('div');
      p.className='unplanned'; p.textContent=`未安排：${u.name}（${u.reason}）`;
      v.insertBefore(p, v.firstChild); });
}

// ---- 收藏 ----
function toggleFav(name) {
  const v = (plan ? [...plan.days.flatMap(d=>d.spots)] : []).find(s=>s.name===name)
            || spots.find(s=>s.name===name) || {name};
  const action = favSet.has(name) ? 'remove' : 'add';
  fetch('/favorites', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({action, spot: {...v, city: '西安'}})})
    .then(r => r.json()).then(d => {
      favSet = new Set(d.favorites.map(f => f.name));
      if (plan) renderItin(); loadFavorites();
    });
}

function loadFavorites() {
  fetch('/favorites').then(r => r.json()).then(d => {
    favSet = new Set(d.favorites.map(f => f.name));
    const el = $('favsList');
    if (!d.favorites.length) { el.innerHTML = '<div class="uempty">还没有收藏 —— 在行程里点 ☆ 收藏景点</div>'; return; }
    el.innerHTML = d.favorites.map(f =>
      `<div class="ucard" onclick="openSpotDetail('${f.name.replace(/'/g,"\\'")}')">${f.image ? `<img class="img" src="${f.image}" style="width:56px;height:56px;border-radius:9px;object-fit:cover" onerror="this.style.display='none'">` : ''}
        <div class="info"><div class="t">${f.name}</div>
        <div class="s">${f.intro || f.desc || ''}</div></div>
        <button class="del" onclick="event.stopPropagation(); toggleFav('${f.name.replace(/'/g,"\\'")}')">✕</button></div>`).join('');
    if (plan) renderItin();
  });
}

    <div style="padding:12px 16px 10px;display:flex;justify-content:space-between;align-items:center">

    <div id="spotPhotos" style="display:flex;gap:8px;overflow-x:auto;padding:0 16px 10px">

          ${r0.hotel ? ' · 🏨 ' + r0.hotel.name : ''}</div>
        ${daysHtml}
        ${r0.unplanned && r0.unplanned.length ? `<div style="color:#98a2b3;font-size:12px;margin-top:8px">未安排：${r0.unplanned.map(u=>u.name).join('、')}</div>` : ''}
      </div>

          padding:12px;font-size:14px;font-weight:700;cursor:pointer" id="pmLoad">载入为当前行程</button>
        <button style="flex:0 0 110px;background:#fff;color:#e03131;border:1px solid #e03131;
          border-radius:10px;font-size:14px;cursor:pointer" id="pmDel">删除此规划</button>
      </div></div>`;
    ov.onclick = e => { if (e.target === ov) ov.remove(); };

          && !confirm('载入会替换规划页当前的行程，继续？')) return;
      ov.remove();

    };
    ov.querySelector('#pmDel').onclick = () => {
      if (!confirm('确定删除这条历史规划？删除后不可恢复')) return;

        .then(() => { ov.remove(); loadPlans();
          if (lastTaskId === taskId) lastTaskId = null; });
    };
  });

// 载入历史行程到规划页（弹窗「载入为当前行程」调用）
function openPlan(taskId) {
  fetch(`/task/${taskId}`).then(r => r.json()).then(d => {
    if (d.status !== 'completed' || !d.result || !d.result.days) return;
    plan = d.result; lastTaskId = taskId; currentDay = 0;
    render(); switchPage('plan');
  });
}

    <div id="hotelResults" style="overflow-y:auto;flex:1;padding:0 16px 12px">

function pickHotel(name, lat, lon) {
  $('hotelResults').innerHTML = '<div class="uempty">正在设为住宿并重新规划…</div>';
  fetch('/hotel/set', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({task_id: lastTaskId, name, lat, lon})})
    .then(async r => {
      const d = await r.json();
      if (!r.ok) { log('错误', d.detail || '设置失败'); $('hotelResults').innerHTML = '<div class="uempty">设置失败</div>'; return; }
      const timer = setInterval(() => {
        fetch(d.poll_url).then(r => r.json()).then(s => {
          if (s.status === 'completed') {
            clearInterval(timer);
            plan = s.result; lastTaskId = d.task_id;
            $('hotelModal').remove(); render();
          }
          if (s.status === 'failed') { clearInterval(timer); log('失败', s.error); }
        });
      }, 600);
    });
}

// ---- 页面切换 ----
function switchPage(which) {
  $('pagePlan').classList.toggle('active', which==='plan');
  $('pageUser').classList.toggle('active', which==='user');
  document.querySelectorAll('.bottombar .b').forEach((b,i) =>
    b.classList.toggle('active', (i===0) === (which==='plan')));
  if (which==='user') { loadPlans(); loadFavorites(); }
  if (which==='plan') setTimeout(() => { if (map) map.invalidateSize(); }, 60);
}

// ---- 地图 ----
function renderMap() {
  $('view').style.display='none'; $('mapView').style.display='block';
  if (!map) {
    map = L.map('map').setView([34.26, 108.94], 11);
    L.tileLayer(tileCfg.tile_url, { subdomains: tileCfg.subdomains,
      attribution: tileCfg.attribution, maxZoom: 18 }).addTo(map);
  }
  setTimeout(() => map.invalidateSize(), 50);
  if (!plan) { $('mapEmpty').style.display='block'; $('legend').innerHTML=''; return; }
  $('mapEmpty').style.display='none';
  Object.values(layers).forEach(l => map.removeLayer(l)); layers = {};
  $('legend').innerHTML = plan.days.map((d,i)=>{
    const c = DAY_COLORS[i%DAY_COLORS.length]; dayOn[i]=true;
    return `<div id="lg${i}" onclick="toggleDay(${i})"><i style="background:${c}"></i>Day${i+1}</div>`;
  }).join('');
  const all = [];
  const toDraw = currentDay === 0
    ? plan.days.map((d, i) => [d, i])
    : [[plan.days[currentDay - 1], currentDay - 1]];
  toDraw.forEach(([d, i]) => {
    const color = DAY_COLORS[i % DAY_COLORS.length];
    let latlngs = d.spots.map(v => {
      const s = spots.find(s => s.name === v.name) || spots[0];
      return tileCfg.gcj ? [s.lat, s.lon] : gcj2wgs(s.lat, s.lon); });
    if (plan.hotel) {
      const h = tileCfg.gcj ? [plan.hotel.lat, plan.hotel.lon]
                            : gcj2wgs(plan.hotel.lat, plan.hotel.lon);
      latlngs = [h, ...latlngs, h];
      L.marker(h, {icon: L.divIcon({className:'', html:
        `<div style="font-size:20px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))">🏨</div>`,
        iconSize:[22,22]})}).bindPopup(`<b>住宿</b><br>${plan.hotel.name}
        <br><button onclick="openSpotDetail('${(plan.hotel.name||'').replace(/'/g,"\\'")}');
          this._map && this._map.closePopup()" style="margin-top:6px;background:#e8f1ff;
          color:#1677ff;border:none;border-radius:8px;padding:5px 12px;cursor:pointer;font-size:12px">查看详情</button>`).addTo(map);
      all.push(h);
    }
    if (latlngs.length < 1) return;
    layers[i] = L.layerGroup().addTo(map);
    if (latlngs.length > 1)
      L.polyline(latlngs, {color, weight:4, opacity:.85}).addTo(layers[i]);
    latlngs.forEach((ll, k) => {
      if (plan.hotel && (k === 0 || k === latlngs.length - 1)) return;
      const v = d.spots[plan.hotel ? k - 1 : k];
      if (!v) return;
      L.circleMarker(ll, {radius:7, color:'#fff', weight:2, fillColor:color, fillOpacity:1})
        .bindPopup(`<b>Day${i+1} ${fmt(v.arrive_h)}</b><br>${v.name}`)
        .addTo(layers[i]);
      all.push(ll);
    });
    const mid = latlngs[Math.floor(latlngs.length/2)];
    const pill = L.divIcon({className:'', html:
      `<div style="background:${color};color:#fff;font-size:12px;font-weight:700;
        padding:3px 10px;border-radius:12px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.25)">
        ${dateOf(i).split(' ')[0]} ${d.spots.length>1 ? Math.round(haversineKm(d))+'km' : ''}</div>`,
      iconSize:null});
    L.marker(mid, {icon: pill}).addTo(layers[i]);
  });
  // 容器尺寸就绪后再 fitBounds，保证打开地图第一眼是完整路线
  setTimeout(() => {
    map.invalidateSize();
    if (all.length) map.fitBounds(all, {padding:[30,30]});
  }, 60);
}

function haversineKm(d) {
  let total = 0;
  for (let i = 1; i < d.spots.length; i++) {
    const a = spots.find(s=>s.name===d.spots[i-1].name), b = spots.find(s=>s.name===d.spots[i].name);
    if (!a || !b) continue;
    const R=6371, p=Math.PI/180;
    const x = Math.sin((b.lat-a.lat)*p/2)**2
      + Math.cos(a.lat*p)*Math.cos(b.lat*p)*Math.sin((b.lon-a.lon)*p/2)**2;
    total += 2*R*Math.asin(Math.sqrt(x));
  }
  return total;
}

function toggleDay(i) {
  dayOn[i] = !dayOn[i];
  if (layers[i]) { if (dayOn[i]) layers[i].addTo(map); else map.removeLayer(layers[i]); }
  $('lg'+i).classList.toggle('off', !dayOn[i]);
}

function switchView(which) {
  document.querySelectorAll('#viewSeg .s').forEach((s,i) =>
    s.classList.toggle('active', (i===0) === (which==='itin')));
  if (which==='itin') { $('mapView').style.display='none'; $('view').style.display='block'; }
  else { if (plan) renderMap(); else { $('view').style.display='none'; $('mapView').style.display='block'; } }
}

// ---- 对话式修改 ----
function sendEdit() {
  const text = $('chatInput').value.trim();
  if (!text) { log('提示', '先输入想怎么改'); return; }
  if (!lastTaskId) { log('提示', '还没有行程——先点「开始规划」生成一份'); return; }
  $('chatSend').disabled = true; $('chatInput').value = '';
  $('log').textContent = ''; log('编辑', `收到指令：${text}`);
  fetch('/plan/edit', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({task_id: lastTaskId, instruction: text})})
    .then(async r => {
      const d = await r.json();
      if (!r.ok) {
        log('错误', `HTTP ${r.status}: ${d.detail || '未知错误'}（如果是 404，请重启后端服务）`);
        $('chatSend').disabled = false;
        return;
      }
      const proto = location.protocol==='https:'?'wss':'ws';
      const ws = new WebSocket(`${proto}://${location.host}${d.ws_url}`);
      ws.onmessage = e => { const d2 = JSON.parse(e.data);
        (d2.progress||[]).forEach(p => log(p.stage, p.msg));
        if (d2.status==='completed') {
          if (d2.result.days) { plan = d2.result; lastTaskId = d.task_id; render(); }
          else log('回复', d2.result.reply || '没有识别到可执行的修改');
          ws.close(); $('chatSend').disabled = false; }
        if (d2.status==='failed') { log('失败', d2.error); ws.close(); $('chatSend').disabled=false; } };
      ws.onerror = () => { log('错误', '连接断开'); $('chatSend').disabled = false; };
    })
    .catch(err => { log('错误', String(err)); $('chatSend').disabled = false; });
}
</script>
