
<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>客服问答 · 路书</title>
<!-- ---- 主题：跟随系统 / 亮 / 暗（无闪烁：首帧前就把 data-theme 定下来）----
     与 static/index.html、static/home.html 同一套实现，逐字照搬不走样。
     不发明第三套主题机制——三页三种主题逻辑是典型漂移源。 -->
<script>
(function () {
  var KEY = 'theme';
  var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  var SUN = '<svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="8" cy="8" r="3.1"/><path d="M8 1.4v1.7M8 12.9v1.7M1.4 8h1.7M12.9 8h1.7M3.3 3.3l1.2 1.2M11.5 11.5l1.2 1.2M12.7 3.3l-1.2 1.2M4.5 11.5l-1.2 1.2"/></svg>';
  var MOON = '<svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13.6 9.6A5.6 5.6 0 0 1 6.4 2.4a5.6 5.6 0 1 0 7.2 7.2z"/></svg>';
  function saved() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }
  window.themeApply = function (s) {
    var dark = s === 'dark' || (s !== 'light' && !!(mq && mq.matches));
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    var b = document.getElementById('themeBtn');
    if (b) {
      b.innerHTML = dark ? MOON : SUN;
      b.title = '主题：' + (s === 'dark' ? '暗色' : s === 'light' ? '亮色' : '跟随系统') + '（点击切换）';
      b.setAttribute('aria-label', b.title);
      b.dataset.mode = s || 'auto';
    }
  };
  window.cycleTheme = function () {
    var dark = document.documentElement.getAttribute('data-theme') === 'dark';
    var next = dark ? 'light' : 'dark';
    try { localStorage.setItem(KEY, next); } catch (e) {}
    window.themeApply(next);
  };
  window.themeApply(saved());                    // 首帧前落地，避免闪烁
  if (mq && mq.addEventListener) {
    mq.addEventListener('change', function () { if (!saved()) window.themeApply(null); });
  }
  document.addEventListener('DOMContentLoaded', function () { window.themeApply(saved()); });
})();
</script>
<style>
  /* ===== 设计令牌：与 index.html / home.html **共用同一套**（逐字照抄）=====
     改这里不等于改另两页，但**值必须一致**——三页各写一份必然漂移。
     刻意不新增任何颜色：徽章/警示一律从下面这套里取。 */
  :root {
    --bg:       oklch(98.5% 0.004 95);
    --surface:  oklch(100% 0.002 95);
    --fg:       oklch(20% 0.015 75);
    --muted:    oklch(45% 0.012 75);
    --muted-2:  oklch(37% 0.014 75);
    --muted-3:  oklch(47% 0.015 80);
    --border:   oklch(89% 0.006 90);
    --fill:     oklch(96.5% 0.005 92);
    --fill-2:   oklch(94% 0.007 92);

    --accent:      oklch(50% 0.17 258);
    --accent-deep: oklch(43% 0.17 260);
    --accent-ink:  oklch(98.5% 0.004 95);
    --accent-soft: oklch(95.5% 0.025 255);
    --accent-line: oklch(62% 0.12 256);
    --accent-solid: oklch(50% 0.17 258);
    --on-accent:  oklch(98.5% 0.004 95);

    --ok:        #00803a;
    --ok-ink:    #2b6e34;
    --ok-soft:   #eef6ee;
    --ok-line:   #cde8cf;
    --warn:      #e8590c;
    --warn-ink:  #bc4c00;
    --warn-soft: #fff4e6;
    --bad:       #ce3531;
    --bad-ink:   #b42318;
    --bad-soft:  #fef2f2;
    --bad-line:  #fee4e2;
    --stay:      #7048e8;
    --note-soft: #fff8e6;
    --note-line: #ffe58f;
    --note-ink:  #af5a00;

    --font-display: Georgia, "Times New Roman", "Source Han Serif SC",
                    "Noto Serif SC", "STZhongsong", "SimSun", serif;
    --font-body:    -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC",
                    "Microsoft YaHei", system-ui, sans-serif;
    --font-mono:    "Cascadia Mono", Consolas, "JetBrains Mono", monospace;
    --sh-3: 0 12px 40px oklch(20% 0.015 75 / .14);
    --e:      cubic-bezier(.22,.61,.36,1);
    --t-fast: .14s;
  }
  :root[data-theme="dark"] {
    --bg: #0e0e10;      --surface: #151619;
    --fg: #dbdad6;      --muted: #8b8a84;   --muted-2: #a5a4a0;  --muted-3: #8d9197;
    --border: #2a2b2f;  --fill: #1d1e21;    --fill-2: #26272a;

    --accent: #99a8d5;  --accent-deep: #8695c6;  --accent-solid: #798abd;
    --accent-ink: #0b0b0e;  --on-accent: #0b0b0e;
    --accent-soft: #212532; --accent-line: #404a67;

    --ok: #4ed589;      --ok-ink: #009f57;  --ok-soft: #0e2517;   --ok-line: #1c4430;
    --warn: #f78955;    --warn-ink: #da672c; --warn-soft: #2f190f;
    --bad: #fb6157;     --bad-ink: #e85854; --bad-soft: #301715;  --bad-line: #5b2724;
    --stay: #8a82e9;    --note-ink: #cc7200; --note-soft: #2d1a0a; --note-line: #5a3f14;
  }

  /* ==================================================================
     玻璃令牌层（v4「液态玻璃 × 工程感」，2026-10-07）
     ------------------------------------------------------------------
     纪律（来自 tweakcn / 五站实测）：
     ① **全部用 color-mix 从上面那套基础令牌派生**，不写裸 hex、不写裸 rgba。
        好处：亮暗切换时自动跟随基础令牌，**不可能漂移**；基础令牌一改，玻璃层跟着变。
     ② `:root` 与 `[data-theme="dark"]` **成对定义**（tweakcn 的核心纪律）。
        玻璃最吃「压什么底色」，暗色不能靠一套值糊弄过去——高光强度必须单独收。
     ③ tweakcn 的「每个语义色拆成底 + 字两枚」：玻璃同理，
        `--glass-bg`（底）与 `--glass-brd`（描边）分开，
        因为 backdrop 后面是任意内容，描边不能跟着底色一起被冲淡。
     实测依据（五站探针）：liquid-glass demo 真值是 `blur(20px) saturate(1.4)`，
     **saturate 是「真玻璃」与「磨砂」的分水岭**——只 blur 是磨砂塑料感。
     ================================================================== */
  :root {
    /* 玻璃底：底色 + 一点透明，让后面的内容透出来。
       blur/saturate 写在 .glass 类里（这里只管色，因为要跟主题走）。 */
    --glass-bg:   color-mix(in oklab, var(--surface) 16%, transparent);
    /* 玻璃描边：比玻璃底更不透明一点，勾出边缘。
       不用 rgba 硬编码——从 --border 派生，亮暗自动成对。 */
    --glass-brd:  color-mix(in oklab, var(--muted-3) 46%, transparent);
    /* 内高光：Apple 玻璃的顶部一道亮边。亮色主题要更明显，暗色要更弱（见下方 dark 块）。 */
    --glass-hi:   color-mix(in oklab, var(--fg) 12%, transparent);
    /* 玻璃上的文字色：不是简单用 --fg，因为玻璃底是半透的，
       压在浅内容上会掉对比度 ⇒ 混一点 --muted-2 稳住（第五部分验收第 2 点按最坏底色算）。 */
    --glass-ink:  var(--fg);
    --glass-ink-dim: var(--muted-2);
    /* 圆角：v4「卡片 16px / 控件胶囊 999」。tweakcn 实测卡片与控件圆角**要分开**，
       这里显式分两枚，不让各处随手写死。 */
    --radius-lg:  16px;
    --radius-md:  10px;
    --radius-pill: 999px;
    /* 点阵：会话区背景层（极低透明度，别抢内容）。 */
    --dot:       color-mix(in oklab, var(--muted-3) 30%, transparent);
    /* Spotlight 光晕的鼠标坐标（magicui Glow Card）：**必须在 :root 声明**——
       未定义的自定义属性会让整条 `background:radial-gradient(…var(--x)…)` 声明
       **静默失效并回退**，页面只是「没有光晕」，浏览器不报任何错。
       这条是 check_frontend.py 第5 项（未定义 CSS 变量引用）抓出来的，
       我在计划条目里写过这个坑，这次自己踩了一次——**登记了不等于不会犯**。 */
    --x: 50%;
    --y: 50%;
    /* 背景层专用（2026-10-08）：网格线与噪点。
       --noise-src 是**内联 SVG data-URI**（零外链、零构建），
       feTurbulence 生成的颗粒用来消除大面积渐变的「塑料光滑感」。 */
    --grid-line: color-mix(in oklab, var(--muted-3) 16%, transparent);
    --noise-src: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='180' height='180' filter='url(%23n)' opacity='.5'/></svg>");
  }
  :root[data-theme="dark"] {
    /* 暗色玻璃 = 亮色的降级版：高光收、底更透、描边更亮一点。
       依据：liquid-glass README 有专门的 `overLight` 开关（压在浅底 vs 深底高光不同），
       而**用两套变量表达比手写两个值更不容易忘**。 */
    --glass-bg:   color-mix(in oklab, var(--surface) 12%, transparent);
    --glass-brd:  color-mix(in oklab, var(--muted-3) 34%, transparent);
    --glass-hi:   color-mix(in oklab, var(--fg) 7%, transparent);
    --glass-ink:  var(--fg);
    --glass-ink-dim: var(--muted-2);
    /* 暗色底上点阵要更弱，否则噪点感明显 */
    --dot:       color-mix(in oklab, var(--muted-3) 18%, transparent);
    --grid-line: color-mix(in oklab, var(--muted-3) 11%, transparent);
  }

  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:var(--font-body);
         font-size:15px; line-height:1.65; -webkit-font-smoothing:antialiased;
         position:relative; isolation:isolate; }

  /* ==================================================================
     背景层 —— **玻璃的本体就在这里**（2026-10-08 重做）
     ------------------------------------------------------------------
     上一版的错：我把玻璃底刷成 72% 白，等于给元素涂了一层白漆，
     **背后什么都没有**，透出来还是纯色 —— 那不叫玻璃，叫半透明卡片。
     真机实测当时全页只有 16 个元素带 backdrop-filter，底色全是
     `oklab(1 … / 0.72)`（= 72% 白），所以调blur 参数也不可能像玻璃。

     参考站（liquid-glass demo）背后是**图像**，玻璃透出的是被扭曲、
     放大的背景内容。本页不放照片（工具页不该被照片抢走可读性），
     改用**动态背景**：
       ① 底色渐变流体（两团大色斑缓慢漂移，周期 24s）
       ② 网格（Acceternity/ Magic UI 都有，20px 细线 + 遮罩渐隐）
       ③ 三个浮动光晕（radial-gradient blob，各自不同周期）
     这三样加起来给 backdrop 提供了**真正可透的内容**，
     玻璃底降到 12~18% 才有意义。
     ================================================================== */
  .bg-layer { position:fixed; inset:0; z-index:-1; overflow:hidden; pointer-events:none; }

  /* ① 底色流体：三团色斑。**只有 b1 动**，b2/b3 静态 ——
     v4 纪律「同屏循环动画 ≤2」：加上 marquee 与 aurora 已经是 2 个了，
     三个 blob 各动一个就变成 5 个（实测踩过）。
     视觉上b2/b3 靠不同色相与位置区分即可，不必都动。
     周期 24s（v4 纪律：循环 4~8s 是上限，这是「氛围」不是「提示」，放慢更耐看）。 */
  .bg-blob { position:absolute; border-radius:50%; filter:blur(90px); opacity:.5; }
  .bg-blob.b1 { width:60vw; height:60vw; left:-14vw; top:-18vw;
    background:radial-gradient(circle at 40% 40%,
      color-mix(in oklab, var(--accent) 55%, transparent), transparent 70%);
    animation:drift1 24s ease-in-out infinite alternate; }
  .bg-blob.b2 { width:55vw; height:55vw; right:-16vw; bottom:-20vw; opacity:.42;
    background:radial-gradient(circle at 60% 50%,
      color-mix(in oklab, var(--note-line) 70%, transparent), transparent 70%); }
  .bg-blob.b3 { width:38vw; height:38vw; left:52%; top:34%; opacity:.3;
    background:radial-gradient(circle at 50% 50%,
      color-mix(in oklab, var(--ok-line) 45%, transparent), transparent 70%); }
  @keyframes drift1 { from { transform:translate3d(0,0,0) scale(1); }
                       to { transform:translate3d(8vw,6vh,0) scale(1.2); } }

  /* ② 点阵 + 网格：**照抄 magicui 原版的 SVG `<pattern>` 实现**
     （2026-10-08 重做。之前我用 CSS `radial-gradient`/`linear-gradient` 平铺——
     **那不是原版做法**，点阵的圆半径、网格的 x/y 偏移量都调不出来，
     看起来「像格子但不像那个库」。）

     原版参数（源码参数表）：
       DotPattern:  width16 height16 x0 y0 **cx1 cy1 cr1**，glow 可选
       GridPattern: width40 height40 **x-1 y-1**，squares 数组 + strokeDasharray
     SVG 用 data-URI 内联（零外链、零构建）。 */
  .bg-grid { position:absolute; inset:0; color:var(--grid-line);
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='40'><path d='M0 0h40v40' fill='none' stroke='currentColor' stroke-opacity='.16' stroke-width='1'/></svg>");
    background-size:40px 40px;
    -webkit-mask:radial-gradient(ellipse 90% 70% at 50% 40%, #000 30%, transparent 78%);
            mask:radial-gradient(ellipse 90% 70% at 50% 40%, #000 30%, transparent 78%); }
  .bg-dots { position:absolute; inset:0; color:var(--dot);
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16'><circle cx='1' cy='1' r='1' fill='currentColor' fill-opacity='.2'/></svg>");
    background-size:16px 16px;
    -webkit-mask:radial-gradient(300px circle at 50% 45%, #000, transparent);
            mask:radial-gradient(300px circle at 50% 45%, #000, transparent); }

  /* 噪点：极低强度的颗粒，消除大面积渐变的「塑料光滑感」 */
  .bg-noise { position:absolute; inset:0; opacity:.16;
    background-image:var(--noise-src); background-size:180px 180px; }

  /* 暗色下的物理约束（实测算出来的，不是拍的）：
     暗色文字（--fg≈rgb(219,218,214)）要透过 12% 玻璃后仍与背景 ≥4.5:1
     ⇒ blob 峰值只能到 rgb(120,135,165)（3.13:1，**不达标**）。
     也就是说：**「背景亮到能看见颜色」与「浅色文字够对比」在暗色下直接冲突。**
     参考站liquid-glass 之所以能两者兼得，是因为它用深色玻璃 + 白字，
     文字亮度不依赖背景亮度。
     ⇒ 我的解法：暗色玻璃**在 backdrop 之上再叠一层暗化**（见下方 ::after），
     这样背景色仍透得出、但整体被压到文字可读。blob 保持可见的亮度。 */
  :root[data-theme="dark"] .bg-blob.b1 { opacity:.30; }
  :root[data-theme="dark"] .bg-blob.b2 { opacity:.26; }
  :root[data-theme="dark"] .bg-blob.b3 { opacity:.18; }

  /* 暗色玻璃的暗化层：盖在 backdrop-filter 结果之上，把整体压暗但保留色相。
     用 `--glass-dim` 而不是写死 rgba，亮暗各自成对。 */
  :root[data-theme="dark"] {
    /* 暗化层：从 --bg 派生（不写死黑色）。关键要求是它**必须比 --surface 更暗**，
       否则压不住底下的 blob（暗色下浅色字 + 亮斑 = 对比度不足）。 */
    --glass-dim: color-mix(in oklab, var(--bg) 72%, transparent);
  }

  @media (prefers-reduced-motion: reduce) {
    .bg-blob { animation:none; }
  }

  /* ---- 玻璃基类（liquid-glass 退化版，Tier 1 纯 CSS）----
     实测 liquid-glass demo 的真值是 blur(20px) saturate(1.4)；
     这里取 14px/140% 是为了让**小元素**（气泡、chip）也稳——
     大卡片上 20px 会把里面的文字糊掉（blur 作用在 backdrop 上，元素越小越要克制）。
     saturate 不能省：省了就是磨砂塑料感（实测 cult-ui 的 blur(8px) 无 saturate 就是那个味）。 */
  .glass { background:var(--glass-bg);
           backdrop-filter:blur(14px) saturate(140%);
           -webkit-backdrop-filter:blur(14px) saturate(140%);
           border:1px solid var(--glass-brd);
           border-radius:var(--radius-lg);
           box-shadow:inset 0 1px 0 var(--glass-hi); }
  /* backdrop-filter 不支持时（老 Firefox / 部分环境）不能塌成透明块——
     浏览器会把带 backdrop-filter 但不支持的元素当普通元素，
     于是只剩半透明底 + 无背景 ⇒ 文字压在后面的内容上，读不了。
     @supports 兜一个不透明底。 */
  @supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))) {
    .glass { background:var(--surface); }
  }

  /* ---- 版心：v3 毛病 1「整页没有版心」----
     元素各自漂浮在空白画布上是这页最不像「网站的一部分」的原因。
     一个 720px 容器居中，页头→说明→会话→运营→页脚成纵向文档流。

     ⚠️ 踩过的坑：`max-width` **含** padding。第一版写
     `max-width:720px; padding:28px max(16px, calc((100vw - 720px)/2))`，
     在 1280 视口下 padding 被算成 280px×2，内容区只剩 720-560 = **160px**
     —— 输入框被压到 83px、标题挤在中间。真机截图才看得出来。
     正确写法：**外层 .wrap-shell 负责居中，内层 .wrap 只管内容宽与纵向留白**。 */
  .wrap { max-width:720px; margin:0 auto; padding:28px 20px 40px; }

  /* ---- 顶部导航：照抄 index.html .site-nav 配方（毛玻璃 + 发丝线）---- */
  .site-nav { position:sticky; top:0; z-index:500; display:flex; align-items:center; gap:10px;
              padding:13px max(24px, calc((100vw - 1180px) / 2));
              background:color-mix(in oklab, var(--bg) 78%, transparent);
              backdrop-filter:saturate(180%) blur(14px);
              border-bottom:1px solid transparent; }
  .site-nav .brand { font-weight:800; font-size:16px; display:flex; align-items:center; gap:9px;
                     letter-spacing:.2px; text-decoration:none; color:inherit; }
  .site-nav .brand:hover { opacity:.82; }
  .site-nav .brand i { width:22px; height:22px; border-radius:7px; display:inline-block;
                       background:linear-gradient(135deg,var(--accent),var(--accent)); }
  .site-nav .links { display:flex; gap:2px; margin-left:14px; }
  .site-nav .links a { font-size:14px; color:var(--muted-2); padding:7px 13px; border-radius:9px;
                       text-decoration:none; }
  .site-nav .links a:hover { background:var(--fill-2); }
  .site-nav .spacer { flex:1; }
  .navtheme { display:flex; align-items:center; justify-content:center; flex:none;
              width:34px; height:34px; border-radius:10px; cursor:pointer;
              background:transparent; border:1px solid var(--border); color:var(--muted-2); }
  .navtheme:hover { background:var(--fill); color:var(--fg); }

  /* ---- 令牌面板：与 index.html 同款（贴右上、surface 底、发丝描边）---- */
  .token-panel { position:fixed; top:54px; right:24px; z-index:600; width:264px;
                 background:var(--surface); border:1px solid var(--border); border-radius:12px;
                 padding:14px; box-shadow:var(--sh-3); }
  .token-panel[hidden] { display:none; }
  .token-label { display:block; font-size:12px; color:var(--muted-2); margin-bottom:6px; }
  .token-input { width:100%; padding:8px 10px; border-radius:8px;
                 border:1px solid var(--border); background:var(--bg); color:var(--fg);
                 font-family:inherit; font-size:14px; }
  .token-input:focus { border-color:var(--accent); outline:none; }
  .token-actions { display:flex; gap:8px; margin-top:10px; }
  .token-actions button { flex:1; padding:8px; border-radius:8px; font-size:13px; font-weight:600;
                          cursor:pointer; border:1px solid transparent; font-family:inherit; }
  .token-save { background:var(--accent-solid); color:var(--on-accent); }
  .token-save:hover { background:var(--accent-deep); }
  .token-clear { background:transparent; color:var(--muted-2); border-color:var(--border); }
  .token-clear:hover { background:var(--fill); color:var(--fg); }
  .token-hint { margin-top:10px; font-size:11.5px; line-height:1.5; color:var(--muted-3); }

  .auth-toast { position:fixed; top:62px; left:50%; transform:translateX(-50%); z-index:700;
                max-width:340px; background:var(--surface); border:1px solid var(--bad-line);
                border-radius:10px; padding:10px 14px; box-shadow:var(--sh-3);
                font-size:13px; line-height:1.5; color:var(--fg); }
  .auth-toast[hidden] { display:none; }

  /* ---- 主体：单栏纵向（会话流是主角）；.wrap 已在上方定义（720px 版心）---- */
  /* 页头标题区（v3 毛病 13：原来说明是浮块，现在是标题的一部分） */
  .page-head { margin-bottom:18px; }
  /* ---- Aurora 渐变标题（magicui Aurora Text）：background-clip:text。
     ⚠️ **静态渐变，不做循环动画**（2026-10-08 降级）：
     同屏动画名额要留给背景 blob（它是玻璃的本体）与 marquee（用户会看）。
     实测加上背景层后同屏 infinite 变成 3 个，违反 v4 纪律「≤2」。
     渐变本身（四个色停 + 220% 宽度）已经足够好看，不需要再动。 */
  .page-title { font-family:var(--font-display); font-size:26px; font-weight:700;
                letter-spacing:-.01em; line-height:1.25; margin:0 0 6px;
                background:linear-gradient(100deg,
                  var(--fg) 0%, var(--accent-deep) 42%, var(--fg) 68%, var(--muted-2) 100%);
                background-size:220% 100%;
                -webkit-background-clip:text; background-clip:text;
                -webkit-text-fill-color:transparent; color:transparent; }
  .page-sub { font-size:13.5px; color:var(--muted-2); margin:0; }

  /* 页脚（v3 毛病 13：原来没有页脚）。极简一行：左版权右链接。 */
  .page-foot { margin-top:30px; padding-top:14px; border-top:1px solid var(--border);
               display:flex; align-items:center; justify-content:space-between;
               gap:12px; flex-wrap:wrap; font-size:12px; color:var(--muted-3); }
  .foot-links { display:flex; gap:14px; }
  .foot-links a { color:var(--muted-2); text-decoration:none; }
  .foot-links a:hover { color:var(--fg); }
  .lead-note { font-size:13px; color:var(--muted-2); background:var(--fill);
               border:1px solid var(--border); border-radius:9px; padding:10px 13px; margin-bottom:16px; }

  /* 不用 min-height + flex:1 把输入行顶到屏幕底：短对话时会在中间留一大片空白，
     视线要跨过空白才够得着输入框。改成「内容多时 log 自己滚、页面整体滚」——
     输入行永远跟在最后一条消息下面。
     scrollTop 由脚本在渲染后设置，无需 smooth（首帧就跳，动画只会看到中间态）。 */
  #support-chat { display:flex; flex-direction:column; }

  /* 点阵背景层（magicui Dot Pattern）：会话区背后极低透明度的点阵。
     放在 log 的 ::before 上而不是 body —— body 上会给整页（包括导航）铺纹理，
     太抢；只在会话区、且透明度 0.3 令牌封顶（实测 Aceternity 的非整数圆角用法给了启发：
     纹理用 `color-mix` 派生天然可控，不靠手调alpha）。 */
  #support-log { display:flex; flex-direction:column; gap:12px; padding-bottom:16px;
                 max-height:62vh; overflow-y:auto; position:relative; }
  #support-log::before { content:''; position:absolute; inset:0; pointer-events:none;
    background-image:radial-gradient(var(--dot) 1px, transparent 1px);
    background-size:22px 22px;
    /* mask 线性渐隐：让点阵在边缘淡出，不出现硬边 */
    -webkit-mask:linear-gradient(to bottom, transparent, #000 12%, #000 88%, transparent);
            mask:linear-gradient(to bottom, transparent, #000 12%, #000 88%, transparent);
    opacity:.5; z-index:0; }
  #support-log > * { position:relative; z-index:1; }

  /* 气泡玻璃化（v4 配方表第1 行）：两边都是玻璃，但底色不同区分说话方。
     blur 14px 是 .glass 的值——**不要给气泡单独调大**，blur 作用在 backdrop 上，
     小元素用20px 会把里面文字糊掉（这是我第 1 步实测 blur 时记下的）。 */
  .msg { max-width:86%; padding:10px 14px; border-radius:var(--radius-lg);
         font-size:14.5px; line-height:1.7; white-space:pre-wrap; overflow-wrap:anywhere;
         position:relative; overflow:hidden;
         backdrop-filter:blur(14px) saturate(180%);
         -webkit-backdrop-filter:blur(14px) saturate(180%); }
  /* 暗化层：盖在 backdrop 结果之上。**亮色下是透明**（不需要），
     暗色下压暗但保留色相 —— 这样 blob 颜色可见、浅色文字仍够对比。
     放在 ::after 而不是直接改 background：直接改background 会把 backdrop 一起关掉。 */
  .msg::after { content:''; position:absolute; inset:0; pointer-events:none;
    background:var(--glass-dim, transparent); z-index:0; }
  .msg > * { position:relative; z-index:1; }
  .msg.q { align-self:flex-end; color:var(--fg);
           /* 用户气泡：从 --accent-soft 派生半透明蓝调，亮暗自动跟随 */
           background:color-mix(in oklab, var(--accent-soft) 62%, transparent);
           border:1px solid var(--glass-brd); }
  .msg.a { align-self:flex-start; color:var(--fg);
           /* 机器人气泡：surface 半透明 + 顶部内高光（玻璃的标志性细节） */
           background:var(--glass-bg);
           border:1px solid var(--glass-brd);
           box-shadow:inset 0 1px 0 var(--glass-hi); }
  /* 空态提示：会话还没开始时给一句可用示例，别给一片空白 */
  .empty { align-self:center; text-align:center; color:var(--muted-3); font-size:13px;
           padding:26px 12px; line-height:1.9; }
  .empty b { display:block; color:var(--muted-2); font-size:14px; margin-bottom:6px; }
  .empty code { font-family:var(--font-mono); font-size:12.5px; background:var(--fill);
                border:1px solid var(--border); border-radius:5px; padding:1px 5px; color:var(--muted-2); }

  /* 引用卡：知识库命中了什么。verified 打勾、未核查的不打——
     「已核查」是后端给的硬事实，前端只如实呈现，不自己判断。 */
  .cites { display:flex; flex-wrap:wrap; gap:6px; margin-top:9px; }
  .cite { font-size:12px; line-height:1.5; padding:3px 9px; border-radius:8px;
          background:var(--fill); border:1px solid var(--border); color:var(--muted-2);
          overflow-wrap:anywhere; }
  .cite .cv { color:var(--ok-ink); margin-left:3px; font-weight:700; }
  .cite.unverified { border-style:dashed; }
  .cite.unverified .cv { color:var(--muted-3); }
  /* 引用详情（citations[].snippet）：plain 双轨后网页端 reply 只剩一句引导语，
     引用内容全在这个字段里 ⇒ 不渲染它等于网页端什么都看不到。
     限 3 条 + 可滚动：5 条全展开会把气泡撑得比回答还长。 */
  .citedetails { margin-top:8px; padding:9px 11px; border-radius:9px;
                 background:var(--fill); border:1px solid var(--border);
                 max-height:15em; overflow-y:auto; }
  .cite-line { font-size:12.5px; line-height:1.6; color:var(--muted-2);
               padding:3px 0; overflow-wrap:anywhere; }
  .cite-line + .cite-line { border-top:1px solid var(--border); }
  .cite-name { font-weight:600; color:var(--fg); margin-right:6px; }
  .cite-snip { color:var(--muted-2); }
  /* 核查状态（原来在 chip 上，chip 删除后移到行内）。
     措辞按v4「核查状态由小标承载」，不喊「引用 N/N 条已核查到库内实体」那句工程话术。 */
  .cite-vf { font-size:11.5px; margin-left:6px; color:var(--ok-ink); white-space:nowrap; }
  .cite-vf.no { color:var(--muted-3); }
  .cite-warn { color:var(--bad-ink); font-size:11.5px; margin-left:6px; }

  /* ---- 三档徽章（v4「胶囊徽章」）：颜色即语义，且**刻意不用红表示转人工** ----
     handoff 是「已登记、人工会跟进」＝正常业务流转；用 --bad-* 红会让用户
     以为系统出错，那才是真的误导。红只留给真正的失败（429/401/网络）。
     形态按 v4 配方表：**胶囊 + 1px 描边**（不是灰底 pill）。
     ⚠️ 徽章**不叠玻璃**：backdrop-filter 会把描边底下的 accent 冲淡，
     实测在小元素上 blur 14px 已经让 1px 描边发虚 —— 胶囊保持实底 + 描边才清楚。 */
  .badge { display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:700;
           line-height:1.5; padding:3px 11px; border-radius:var(--radius-pill);
           margin-bottom:8px; border:1px solid transparent; }
  .badge .licon { flex:0 0 auto; }
  .badge.hit      { background:var(--ok-soft);      border-color:var(--ok-line);      color:var(--ok-ink); }
  .badge.partial  { background:var(--note-soft);    border-color:var(--note-line);    color:var(--note-ink); }
  .badge.handoff  { background:var(--accent-soft);  border-color:var(--accent-line);  color:var(--accent-deep); }

  /* ---- Border Beam 扫边（magicui，v4 配方表第 2 行）----
     只给 handoff 徽章用，且**每屏至多 1 个**（v4 纪律：循环动画同屏 ≤2）——
     转人工本身是低频事件，扫边是「这条挂起等人」的提示，不该满屏闪。
     实现照抄 magicui 的手法（实测它用 @property + conic-gradient）：
     `@property` 让--beam-angle 可插值 → conic-gradient 绕着转 → 用 mask 把中间挖空。
     ⚠️ syntax 用 "*" 而非 "<angle>"：这是 magicui 实测的做法（它 20+ 条声明全是 "*"），
     "<angle>" 在旧浏览器可能不认。 */
  /* ---- Border Beam 扫边（magicui @/registry/magicui/border-beam）----
     转人工本身是低频事件，扫边是「这条挂起等人」的提示，不该满屏闪。

     ⚠️ **2026-10-08 按原版源码重写**。之前我凭理解写成「两段 conic + mask 挖边」，
     抓��原版源码后发现差三处：
       ① 渐变是**三段** `from-transparent via-x to-transparent`，不是两段 conic；
       ② `borderWidth` 是**独立参数**（原版默认 1），扫边粗细可调；
       ③ 原版用 `offset-path`/`offset-distance` 让光沿边框**走**，
          不是一个整圈旋转的 conic —— 视觉上更像「一道光扫过」而非「彩虹圈」。
     用 CSS 变量表达（原版就是把这几个值暴露成 props），
     参数与原版默认对齐：size50 / duration 6s / delay 0 / borderWidth 1。 */
  @keyframes beam-spin { from { transform:rotate(0deg); } to { transform:rotate(360deg); } }
  .badge.handoff.beam { position:relative; isolation:isolate; --beam-size:50%; --beam-w:1px; }
  .badge.handoff.beam::before {
    content:''; position:absolute; inset:calc(-1 * var(--beam-w)); z-index:-1;
    border-radius:inherit; padding:var(--beam-w);
    /* 三段渐变（照抄原版 from-transparent via-… to-transparent） */
    background:conic-gradient(from var(--beam-angle),
      transparent 0%, transparent 62%,
      var(--accent-solid) 78%,
      var(--accent-deep) 84%,
      transparent 90%, transparent 100%);
    /* 只留边缘：中间用 mask 挖空 */
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor; mask-composite:exclude;
    animation:beam-spin 6s linear infinite;
  }
  @property --beam-angle { syntax:"*"; inherits:false; initial-value:0deg; }
  /* 循环动画必须响应 prefers-reduced-motion，且**冻结要 duration + iteration-count 成对**
     （只压 duration 会幻影抖动—— hero_motion_check 的教训，直接适用）。 */
  @media (prefers-reduced-motion: reduce) {
    .badge.handoff.beam::before { animation:none; --beam-angle:0deg; }
  }

  /* caveat 的 gap.note（v3 毛病 3：禁自造黄色，改用全站警示卡形态）——
     surface 底 + warn 左条 + ink 字。参照 home.html:535 #limits 与 index.html:448 .rb-warn。 */
  .gapnote { margin-top:9px; padding:9px 12px; border-radius:var(--radius-md); font-size:13px;
             line-height:1.65; color:var(--fg);
             background:var(--surface); border:1px solid var(--border);
             border-left:3px solid var(--warn);
             display:flex; gap:7px; align-items:flex-start; overflow-wrap:anywhere; }
  .gapnote .licon { flex:0 0 auto; margin-top:2px; color:var(--warn-ink); }
  .handoff-note { margin-top:9px; font-size:13px; color:var(--muted-2); line-height:1.7; }

  /* ---- 输入区（v4 毛病 9：textarea 有原生 resize 手柄，聊天框能被拖变形）----
     resize:none + 固定 2 行高，内容超长纵向滚动（JS 的 autoGrow 仍管自适应）。 */
  .composer { display:flex; gap:8px; align-items:flex-end; }
  .composer textarea { flex:1; min-height:44px; max-height:140px; resize:none; overflow-y:auto;
                       padding:11px 20px; border-radius:var(--radius-pill);
                       border:1px solid var(--glass-brd); background:var(--glass-bg);
                       color:var(--fg); font-family:inherit;
                       font-size:14.5px; line-height:1.5;
                       backdrop-filter:blur(14px) saturate(140%);
                       -webkit-backdrop-filter:blur(14px) saturate(140%); }
  .composer textarea:focus { border-color:var(--accent-line); outline:none; }
  /* ---- Shimmer 发送钮（magicui）：45° 白色高光条扫过，2.6s linear infinite ---- */
  /* 输入框有 1px 边框、按钮没有 ⇒ 内容自然高度差 2px（实测输入框 46 / 按钮 44），
     两者并排时基线差 2px、肉眼只觉得「有点歪」。
     按钮补1px 同色边框，配合全局 `box-sizing:border-box` + `height:44px`
     ⇒ **外部尺寸不变**（仍是 44），内部对齐。border-color 用 transparent
     以免在可用态看到多余描边（可用态是靠背景色表明「可点」的）。 */
  .composer button { position:relative; overflow:hidden; flex:none; height:44px; padding:0 20px;
                     border-radius:var(--radius-pill); cursor:pointer;
                     font-family:inherit; font-size:14.5px; font-weight:600;
                     background:var(--accent-solid); color:var(--on-accent);
                     border:1px solid transparent; }
  .composer button::after { content:''; position:absolute; top:0; left:0; width:45%; height:100%;
    background:linear-gradient(100deg, transparent, color-mix(in oklab, var(--on-accent) 45%, transparent), transparent);
    transform:translateX(-150%); pointer-events:none; }
  /* ⚠️ 动画必须挂在 ::after（高光条）上，**不能挂按钮本体**。
     第一版我写成 `.composer button:not(:disabled){animation:shimmer …}`，
     而 keyframes 里是 `transform:translateX(-150%→350%)`
     ⇒ **整个按钮在左右平移**，真机一眼看出「按钮一直在乱晃」。
     按钮本体是**位置敏感的交互元素**（用户要瞄准点它），不能有 transform。
     高光条用绝对定位覆盖在按钮上，扫的是它自己，不是按钮。 */
  .composer button:not(:disabled)::after { animation:shimmer 2.6s linear infinite; }
  @keyframes shimmer { from { transform:translateX(-150%); }
                       12% { transform:translateX(-150%); }
                       to { transform:translateX(350%); } }
  /* 禁用态：**描边式**而不是灰白填充。
     原来用 `background:var(--fill-2)` 填出一块灰白，跟玻璃输入区贴在一起
     糊成一片、看不出那是个按钮（真机截图发现的）。

     ⚠️ 两点都是截图/实测逼出来的：
     ① 用 `outline` 而**不是 `border`**：按钮 `height:44px` 定高，
        换 border 后实测变 46px、与输入框差 2px 并排时基线歪（量几何才看得见）。
        `outline` 不参与布局。
     ② 用**实线**而不是 dashed：2x 截图下虚线呈锯齿状、显脏（真机 1x 也偏重）。
        「不可点」靠**字色压暗 + 无填充**表达已经足够，不需要虚线。 */
  .composer button:disabled { background:transparent; color:var(--muted-3);
    cursor:not-allowed; outline:1px solid var(--glass-brd); outline-offset:-1px;
    padding:0 24px; }                       /* 内边距加大：描边框里「发送」不局促 */
  .composer button:disabled::after { display:none; }
  @media (prefers-reduced-motion: reduce) {
    .composer button:not(:disabled)::after { animation:none; }
    .composer button:not(:disabled)::after { display:none; }
  }

  /* ---- Marquee 示例条（magicui）：「你可以问」的滚动 chip，点一下填进输入框 ----
     两份内容 translateX(0→-50%) 线性循环；宽度 200% 是关键（不然第二份接不上）。 */
  .marquee { position:relative; overflow:hidden; margin:0 0 14px;
             -webkit-mask:linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent);
             mask:linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent); }
  .marquee-track { display:flex; width:200%; animation:marquee 26s linear infinite; }
  .marquee:hover .marquee-track { animation-play-state:paused; }   /* 悬停停：给用户反应时间 */
  .marquee-group { display:flex; gap:8px; padding-right:8px; }     /* 每组自带右隙，两组才接得上 */
  @keyframes marquee { from { transform:translateX(0); } to { transform:translateX(-50%); } }
  .mchip { flex:none; font-size:12.5px; padding:5px 11px; border-radius:var(--radius-pill);
           background:var(--glass-bg); border:1px solid var(--glass-brd);
           color:var(--muted-2); cursor:pointer; user-select:none; white-space:nowrap;
           backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); }
  .mchip:hover { color:var(--fg); border-color:var(--accent-line); }
  @media (prefers-reduced-motion: reduce) {
    .marquee-track { animation:none; width:auto; flex-wrap:wrap; }  /* 静止 = 换行全展示 */
    .marquee { -webkit-mask:none; mask:none; }
  }

  /* ---- 运营视图：低频内部功能，折叠起来不与主流程抢视觉权重 ---- */
  #ops-view { margin-top:26px; border-top:1px solid var(--border); padding-top:14px; }
  #ops-view > summary { cursor:pointer; font-size:13px; color:var(--muted-2); list-style:none; }
  #ops-view > summary::-webkit-details-marker { display:none; }
  #ops-view > summary::before { content:'▸ '; color:var(--muted-3); }
  #ops-view[open] > summary::before { content:'▾ '; }
  #ops-body { margin-top:12px; font-size:13px; color:var(--muted-2); }
  /* 运营视图（v3 毛病 7：紧凑行，一屏 ≥12 条）+ Spotlight 跟随光晕（v4 配方表第 4 行）
   ---- 密度优先于呼吸感，但仍守住对比度门槛 ---- */
  .ops-title { font-size:14px; font-weight:700; color:var(--fg); margin-bottom:8px;
               font-variant-numeric:tabular-nums; }/* 等宽数字：计数跳变时宽度不抖 */
  .ops-chips { display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-bottom:8px; }
  .ops-chip { font:inherit; font-size:12.5px; padding:3px 10px; border-radius:var(--radius-pill);
              cursor:pointer; white-space:nowrap;
              background:var(--glass-bg); border:1px solid var(--glass-brd); color:var(--muted-2); }
  .ops-chip.on { background:var(--accent-solid); border-color:var(--accent-solid);
                 color:var(--on-accent); font-weight:600; }/* 当前项 accent 反白 */
  .ops-chip:hover:not(.on) { color:var(--fg); border-color:var(--accent-line); }
  /* 筛选条尾的小字（裁定 6：把「筛选出 M 条」从标题挪到这里） */
  .ops-chips-tail { font-size:11.5px; color:var(--muted-3); margin-left:2px; }

  /* 紧凑行：表格化五列（时间 · 渠道 · 问题 · 状态 · 操作），行高 ≤44px。
     grid-template-columns 的 minmax(0,1fr) 是关键——
     **缺了它，长问题会撑破整行把右侧按钮挤出视口**（v3 教训：minmax(0,1fr) 经验）。 */
  .ops-row { display:grid; grid-template-columns:96px 58px minmax(0,1fr) 62px auto;
             gap:0 10px; align-items:center;
             padding:7px 10px; border-bottom:1px solid var(--border);
             font-size:12.5px; min-height:40px; position:relative; }
  .ops-row:last-child { border-bottom:none; }
  /* Spotlight（magicui **MagicCard** 原版思路，2026-10-08 按源码重写）：
     ⚠️ 之前我只写了一个跟随光晕的 radial-gradient，
     **漏掉了原版的核心 —— 跟着鼠标走的渐变边框**（gradientFrom→gradientTo）。
     原版参数：gradientSize200 / gradientOpacity0.8 / gradientFrom #9E7AFF / gradientTo #FE8BBB。
     这里用 CSS 变量对应：--spot-size / --spot-op / 两个色停走令牌。
     两层：① ::before 渐变边框（鼠标位置处显形）② ::after 内部柔光。 */
  .ops-row { --spot-size:200px; --spot-op:.8; --spot-from:var(--accent); --spot-to:var(--note-line); }
  .ops-row::before {
    content:''; position:absolute; inset:0; pointer-events:none; border-radius:inherit;
    padding:1px; opacity:0; transition:opacity .18s var(--e);
    background:radial-gradient(var(--spot-size) circle at var(--x,50%) var(--y,50%),
      var(--spot-from), var(--spot-to), transparent calc(var(--spot-size) * .9));
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor; mask-composite:exclude;
  }
  .ops-row::after {
    content:''; position:absolute; inset:0; pointer-events:none;
    opacity:0; transition:opacity .18s var(--e);
    background:radial-gradient(calc(var(--spot-size) * .7) circle at var(--x,50%) var(--y,50%),
      color-mix(in oklab, var(--spot-from) calc(var(--spot-op) * 22%), transparent), transparent 72%);
  }
  .ops-row:hover::before, .ops-row:hover::after { opacity:1; }
  .ops-row > * { position:relative; }
  .ops-t { color:var(--muted-3); font-variant-numeric:tabular-nums; font-size:11.5px;
           white-space:nowrap; }
  .ops-q { color:var(--fg); line-height:1.45; overflow-wrap:anywhere;   /* 长问题不撑破行 */
           display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical;
           overflow:hidden; }
  /* 「重开」小标（裁定 7）：客户在 closed 之后又来了 ⇒ 运营看不出这单跟进过。 */
  .ops-reopen { display:inline-block; font-size:10.5px; line-height:1.4; padding:0 5px;
                margin-right:5px; border-radius:4px; font-weight:700;
                background:var(--note-soft); border:1px solid var(--note-line);
                color:var(--note-ink); vertical-align:1px; }
  .ops-st { font-size:11.5px; color:var(--muted-3); white-space:nowrap; }
  .ops-st.st-handoff { color:var(--accent-deep); font-weight:600; }
  .ops-act { white-space:nowrap; text-align:right; }
  .ops-btn { font:inherit; font-size:11.5px; padding:3px 9px; border-radius:var(--radius-pill);
             cursor:pointer; background:transparent; color:var(--accent-deep);
             border:1px solid var(--accent-line); }
  .ops-btn:hover { background:var(--accent-soft); }
  /* 渠道标记：来源不同排查方式不同，值得单独标出来 */
  .ops-ch { font-size:11px; padding:1px 7px; border-radius:5px; text-align:center;
            background:var(--fill); border:1px solid var(--border); color:var(--muted-2);
            white-space:nowrap; }
  .ops-ch.mp { background:var(--ok-soft); border-color:var(--ok-line); color:var(--ok-ink); }
  .ops-empty { padding:16px 4px; color:var(--muted-3); font-size:13px; }
  .ops-msg { margin-top:9px; padding:9px 11px; border-radius:9px; font-size:12.5px;
             border:1px solid var(--border); background:var(--fill); color:var(--muted-2); }
  .ops-msg.bad { background:var(--bad-soft); border-color:var(--bad-line); color:var(--bad-ink); }
  /* 窄屏：五列会挤扁 → 折成两行（时间+渠道 / 问题 / 状态+操作）。
     不用 min-width 硬扛宽度，那会导致横向溢出（v3 教训）。 */
  @media (max-width:560px) {
    .ops-row { grid-template-columns:1fr auto; gap:2px 8px; padding:9px 10px; }
    .ops-t { grid-column:1; }
    .ops-ch { grid-column:2; grid-row:1; }
    .ops-q { grid-column:1 / -1; -webkit-line-clamp:2; }
    .ops-st { grid-column:1; grid-row:3; }
    .ops-act { grid-column:2; grid-row:3; }
  }
</style>
</head>
<body>

<!-- 背景层：玻璃的本体。z-index:-1 + body 的 isolation:isolate 保证它在内容之下、
     且不会跟页面外层产生层叠上下文冲突。aria-hidden：纯装饰，读屏不播报。 -->
<div class="bg-layer" aria-hidden="true">

<nav class="site-nav">

<div class="wrap">
  <!-- 页头说明融进标题区（v3 毛病 13：原来是浮块）。副题不是卡片，是标题的一部分。 -->
  <header class="page-head">
    <h1 class="page-title">咨询助手</h1>
    <p class="page-sub">基于行程知识库；答不了的会转人工跟进</p>
  </header>

  <section id="support-chat">
    <!-- Marquee 示例条（magicui）：内容由 JS 按同一数组渲染**两份**，
         translateX(0→-50%) 循环时第二份正好接上第一份的尾。点击 chip 填入输入框。

         ⚠️ 位置纪律：必须在 #support-log **之前**。第一版放在之后，
         scrollIntoView({block:'end'}) 把它带进两轮对话中间 ——
         示例条是「输入区的辅助」，不是会话内容，不该混在对话流里。 -->
    <div class="marquee" id="askMarquee" aria-hidden="false">
      <div class="marquee-track" id="askMarqueeTrack"></div>
    </div>

    <div id="support-log" aria-live="polite"></div>

    <div class="composer">
      <!-- placeholder 不带省略号：示例问题已由上方 marquee chip 承担（可点击），
           占位文案再列一串 + 省略号是重复且拖沓。 -->
      <textarea id="support-input" rows="1" maxlength="500"
                placeholder="问景点、美食、门票、开放时间"></textarea>
      <button id="support-send" disabled>发送</button>
    </div>

  <details id="ops-view">
    <summary>运营视图（内部）</summary>

  </details>

  <!-- 页脚（v3 毛病 13：原来无页脚）。
       「完整记录以服务端留痕为准」这句有实际意义：页面的会话流只是当前浏览器的，
       服务端 `data/conversations/{sid}.json` 才是权威——不写清楚会让人以为刷新就没了。 -->
  <footer class="page-foot">
    <span>© 路书 · 咨询助手 · 完整记录以服务端留痕为准</span>

<script>
/* 访问令牌：与规划器共用同一 localStorage key('appToken')。
   这里**必须复用同一份**：用户在规划页填过令牌，切到客服页不该再填一遍。 */
(function () {
  var KEY = 'appToken';
  var btn = document.getElementById('tokenBtn');
  var panel = document.getElementById('tokenPanel');
  var input = document.getElementById('tokenInput');
  if (!btn || !panel) return;
  function openIt() {
    if (input) { try { input.value = localStorage.getItem(KEY) || ''; } catch (e) {} }
    panel.hidden = false;
    if (input && !input.value && input.focus) input.focus();
  }
  function closeIt() { panel.hidden = true; }
  window.tokenGet = function () { try { return localStorage.getItem(KEY) || ''; } catch (e) { return ''; } };
  btn.addEventListener('click', function () { if (panel.hidden) openIt(); else closeIt(); });
  document.addEventListener('click', function (e) {
    if (panel.hidden) return;
    if (panel.contains(e.target) || btn.contains(e.target)) return;
    closeIt();
  });
  var save = panel.querySelector('[data-token="save"]');
  var clear = panel.querySelector('[data-token="clear"]');
  if (save) save.addEventListener('click', function () {
    var v = input ? String(input.value || '').trim() : '';
    try { v ? localStorage.setItem(KEY, v) : localStorage.removeItem(KEY); } catch (e) {}
    closeIt();
  });
  if (clear) clear.addEventListener('click', function () {
    try { localStorage.removeItem(KEY); } catch (e) {}
    if (input) input.value = '';
  });
})();
</script>
<script>
/* ---- 转义：唯一出口 ----
   reply 来自 RAG 生成层、citations[].name 来自语料，都是**外部文本**。
   全页禁止裸 innerHTML 拼外部值，一律走 esc()。
   （tools/support_smoke.js 有转义断言，第 9 步还有反向验证钉死这条。） */
function esc(v) {
  return String(v === null || v === undefined ? '' : v)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

/* ---- 访问令牌：同源才注 X-App-Token，跨域绝不带（防泄露）----
   与 index.html 同一套包装逻辑。未设令牌时原样透传，行为与改造前一致。 */
(function () {
  var orig = window.fetch ? window.fetch.bind(window) : null;
  if (!orig) return;
  window.fetch = function (input, init) {
    var tok = window.tokenGet ? window.tokenGet() : '';
    if (!tok) return orig(input, init);
    var url = typeof input === 'string' ? input
            : ((input && input.url) || String(input || ''));
    var same;
    try { same = new URL(url, location.href).origin === location.origin; }
    catch (e) { same = false; }
    if (!same) return orig(input, init);          // 跨域绝不带令牌
    var h = (init && init.headers) || {};
    var o = {};
    var has = false;
    for (var k in h) { o[k] = h[k]; if (k.toLowerCase() === 'x-app-token') has = true; }
    if (!has) o['X-App-Token'] = tok;
    return orig(input, { ...(init || {}), headers: o });
  };
})();

/* ---- 401/429 提示：各只弹一次，不刷屏 ---- */
var authToastTimer = null, rateNoted = false;
function toastOnce(kind, msg) {
  if (kind === '429') { if (rateNoted) return; rateNoted = true; }
  var t = document.getElementById('authToast');
  if (!t) return;
  t.textContent = msg;
  t.hidden = false;
  clearTimeout(authToastTimer);
  authToastTimer = setTimeout(function () { t.hidden = true; }, 4200);
}

/* ---- 会话 id：localStorage.support_sid，16 位小写 hex（满足后端白名单）---- */
function sessionId() {
  var v = null;
  try { v = localStorage.getItem('support_sid'); } catch (e) {}
  if (!v || !/^[0-9a-f]{16}$/.test(v)) {
    v = (window.crypto && crypto.randomUUID)
      ? crypto.randomUUID().replace(/-/g, '').slice(0, 16)
      : Array.from({length:16}, () => '0123456789abcdef'[Math.floor(Math.random()*16)]).join('');
    try { localStorage.setItem('support_sid', v); } catch (e) {}
  }
  return v;
}

/* ---- 会话暂存（zcode 裁定 8）：刷新不丢对话 ----
   用 sessionStorage（不是 localStorage）：关掉标签页就该清掉，
   游客不需要「永久历史」，那属于服务端留痕的职责。
   ⚠️ 这是**缓存不是权威**：`/support/conversation/{sid}` 才是权威
   （页脚已写明「完整记录以服务端留痕为准」），这里只解决「刷新一下就没了」的体验断点。 */
var HIST_MAX = 20;                       // 裁定：最近 20 轮
function histKey() { return 'support_hist_' + sessionId(); }
function histLoad() {
  try {
    var raw = sessionStorage.getItem(histKey());
    var arr = raw ? JSON.parse(raw) : [];
    return Array.isArray(arr) ? arr.slice(-HIST_MAX) : [];
  } catch (e) { return []; }
}
function histSave(entry) {
  try {
    var arr = histLoad();
    arr.push(entry);                                  // {cls,text,cites,gap,action}
    if (arr.length > HIST_MAX) arr = arr.slice(-HIST_MAX);
    sessionStorage.setItem(histKey(), JSON.stringify(arr));
  } catch (e) { /* 隐私模式/超额 → 静默降级，不影响主流程 */ }
}
function histRestore() {
  var arr = histLoad();
  if (!arr.length) return 0;
  arr.forEach(function (h) {
    if (!h || !h.text) return;
    var b = addMsg(h.cls || 'a', h.text);
    if (b && h.action) addBadge(b, h.action);
    if (b && h.cites) addCiteDetails(b, h.cites);
    if (b && h.gap && h.gap.note) addGapNote(b, h.gap);
    if (b && h.action === 'handoff') addHandoffNote(b);
  });
  return arr.length;
}

var log = document.getElementById('support-log');
var input = document.getElementById('support-input');
var sendBtn = document.getElementById('support-send');
var seq = 0, busy = false, histRestored = false;

function emptyState() {
  if (!log || log.childElementCount) return;
  var d = document.createElement('div');
  d.className = 'empty';
  // 文案是固定字符串，不含外部值，但仍走 textContent 保持一致
  d.innerHTML = '<b>问点什么</b>'
    + '知识库覆盖景点与美食的名称、简介、门票、开放时间、游玩时长。';
  log.appendChild(d);
}
/* 注意：**启动时的历史恢复不在这里做**。
   它必须等到 BADGES（徽章表）与 addCiteDetails/addGapNote 都定义好之后 ——
   我第一版把它放在这里，而 BADGES 声明在文件更下方 ⇒ `var` 提升只给 undefined，
   于是 `BADGES[action]` 抛 "Cannot read properties of undefined"，
   **整条恢复链断掉**（真机刷新一次就复现）。
   调用点已挪到 BADGES 之后，见文件下方 `restoreIfAny()`。 */

/* ---- Marquee 示例条（magicui）----
   渲染**两份**同样内容：translateX(0→-50%) 循环时第二份正好接上第一份尾，
   这是 marquee 的标准做法（一份内容会在 50% 处露白）。
   示例文案是固定数组（不含外部值），点一下填进输入框——沿用现有交互，不引入新机制。 */
var ASK_EXAMPLES = ['西安有什么好吃的', '兵马俑门票多少钱', '鼓浪屿怎么去',
                    '黄山要爬多久', '西湖门票多少', '故宫需要预约吗'];
function renderMarquee() {
  var track = document.getElementById('askMarqueeTrack');
  if (!track) return;
  track.textContent = '';
  for (var g = 0; g < 2; g++) {                    // 两份
    var group = document.createElement('div');
    group.className = 'marquee-group';
    ASK_EXAMPLES.forEach(function (q) {
      var chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'mchip';
      chip.dataset.example = q;                      // 纯文本点击填入，不用 innerHTML
      chip.textContent = q;
      group.appendChild(chip);
    });
    track.appendChild(group);
  }
}
renderMarquee();
// 事件委托：marquee 里的 chip 是动态生成的，绑一次就够
document.addEventListener('click', function (e) {
  var chip = e.target && e.target.closest ? e.target.closest('[data-example]') : null;
  if (!chip || !input) return;
  input.value = chip.dataset.example || '';
  input.dispatchEvent(new Event('input', { bubbles: true }));
  input.focus();
});

function scrollDown() {
  if (!log) return;
  /* 只滚 log 自己（它有 max-height + overflow-y:auto）。
     ⚠️ 为什么不用简报第 11 条的 `scrollIntoView({block:'end'})`：
     实测它**根本不产生滚动** —— marquee 移到 log 之前后，log 底部本来就在视口内，
     `scrollTop` 一直是 0（第 3 轮起最后一条问答被顶出视野，v4 验收第 6 点不通过）。
     而用 scrollIntoView 的另一版又会把 marquee 卷进两轮对话中间。
     ⇒ 最终方案：**只改 log 的 scrollTop，并把最后一轮的用户问题放在容器可视区顶部**——
     这样「问题 + 回答开头」一定可见，回答的结论（缺口块/引用收尾）在下方滚动可达。
     长回答超一屏时「问题+回答全可见」物理上做不到，这是取舍不是缺陷。 */
  var bubbles = log.querySelectorAll('.msg.a');
  var lastA = bubbles[bubbles.length - 1];
  var prev = lastA ? lastA.previousElementSibling : null;
  if (prev && prev.classList.contains('msg')) {
    // 让最后那条用户问题的底边落在容器可视区**顶部偏下一点**（留出回答开头）
    var top = prev.offsetTop - log.clientHeight * 0.30;
    log.scrollTop = Math.max(0, Math.min(log.scrollHeight - log.clientHeight, top));
  } else {
    log.scrollTop = log.scrollHeight;      // 没有成对气泡（仅提问）→ 直接到底
  }
}

function addMsg(cls, text) {
  if (!log) return null;
  var empty = log.querySelector('.empty');
  if (empty) empty.remove();                 // 首次真实消息后清掉空态
  var el = document.createElement('div');
  el.className = 'msg ' + cls;
  el.textContent = text;                     // 纯文本：外部内容一律走这里
  log.appendChild(el);
  scrollDown();
  return el;
}

/* 引用详情：citation.snippet（2026-10-07 后端 plain 双轨新增）。
   网页端 reply 只留一句引导语，**引用内容全部走这个字段**——
   所以它不是可选装饰，不渲染等于网页端什么都看不到。
   snippet 同样来自语料 ⇒ 一律 textContent。 */
function addCiteDetails(bubble, list) {
  if (!bubble || !Array.isArray(list) || !list.length) return;
  var box = document.createElement('div');
  box.className = 'citedetails';
  list.forEach(function (c) {
    if (!c) return;
    var line = document.createElement('div');
    line.className = 'cite-line';
    var head = document.createElement('span');
    head.className = 'cite-name';
    head.textContent = String(c.name || '');
    line.appendChild(head);
    if (c.snippet) {
      var sn = document.createElement('span');
      sn.className = 'cite-snip';
      sn.textContent = String(c.snippet);       // 语料文本，纯文本
      line.appendChild(sn);
    }
    if (c.verified === true) {
      var v = document.createElement('span');
      v.className = 'cite-vf';
      v.textContent = '✓已核查';
      line.appendChild(v);
    } else {
      var v2 = document.createElement('span');
      v2.className = 'cite-vf no';
      v2.textContent = '未核查';
      line.appendChild(v2);
    }
    box.appendChild(line);
  });
  if (box.childElementCount) { bubble.appendChild(box); scrollDown(); }
}

/* ---- 三档徽章：后端 action 直接映射前端语义，不再自己推断一遍 ----
   后端已经决策过一次（复用 rag 的 gap，不是第二套判断），前端**只呈现**。
   刻意不在前端复刻判定逻辑：两套口径必然漂移（HANDOFF 决策 18 的原话）。 */
var ICON_WARN = '<svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" ' +
  'stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
  '<path d="M8 2.5 14.5 13.5h-13z"/><path d="M8 6.6v3"/><path d="M8 11.4v.1"/></svg>';
var ICON_CHECK = '<svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" ' +
  'stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
  '<path d="M3.5 8.5 6.5 11.5 12.5 4.5"/></svg>';
var ICON_HAND = '<svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" ' +
  'stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
  '<circle cx="8" cy="8" r="6.2"/><path d="M5.4 8h5.2M8 5.4v5.2"/></svg>';

var BADGES = {
  answer:        { cls: 'hit',     text: '命中知识库',   icon: ICON_CHECK },
  answer_caveat: { cls: 'partial', text: '部分答案',     icon: ICON_WARN },
  handoff:       { cls: 'handoff', text: '已登记转人工', icon: ICON_HAND }
};

function addBadge(bubble, action) {
  var b = BADGES[action] || { cls: 'partial', text: String(action || '未知'), icon: ICON_WARN };
  var el = document.createElement('span');
  // handoff 额外挂 .beam（Border Beam 扫边）：转人工是低频事件，
  // 扫边是「这条挂起等人」的提示 —— 每屏至多 1 个，v4 纪律。
  el.className = 'badge ' + b.cls + (action === 'handoff' ? ' beam' : '');
  el.innerHTML = '<span class="licon" aria-hidden="true">' + b.icon + '</span>';
  el.appendChild(document.createTextNode(b.text));
  bubble.insertBefore(el, bubble.firstChild);   // 徽章在气泡顶部
}

function addGapNote(bubble, gap) {
  if (!gap || !gap.note) return;
  var el = document.createElement('div');
  el.className = 'gapnote';
  el.innerHTML = '<span class="licon" aria-hidden="true">' + ICON_WARN + '</span>';
  // gap.note 来自后端（内部生成但仍按外部文本处理）
  el.appendChild(document.createTextNode(String(gap.note)));
  bubble.appendChild(el);
}

function addHandoffNote(bubble) {
  var el = document.createElement('div');
  el.className = 'handoff-note';
  el.textContent = '人工会跟进，也可以换个问法试试。';
  bubble.appendChild(el);
}

async function send() {
  if (busy) return;
  var text = (input && input.value || '').trim();
  if (!text) return;
  busy = true;
  if (sendBtn) sendBtn.disabled = true;
  addMsg('q', text);
  histSave({ cls: 'q', text: text });          // 问句先存：即使回答失败也不丢用户的话
  input.value = '';
  autoGrow();
  var mySeq = ++seq;
  try {
    var res = await fetch('/support/message', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: sessionId(), text: text })
    });
    if (res.status === 429) { toastOnce('429', '请求过于频繁，请稍后再试'); return; }
    if (res.status === 401) { toastOnce('401', '访问令牌无效，请在右上角填入'); return; }
    var d = await res.json();
    if (mySeq !== seq) return;               // 有更新的请求在飞，丢弃本次
    if (!res.ok) throw new Error((d && d.detail) || ('HTTP ' + res.status));
    var bubble = addMsg('a', (d && d.reply) || '');
    addBadge(bubble, d && d.action);
    addCiteDetails(bubble, d && d.citations);
    if (d && d.action === 'answer_caveat') addGapNote(bubble, d.gap);
    if (d && d.action === 'handoff') addHandoffNote(bubble);
    /* 存回答：**只存后端给的字段**（reply/action/citations/gap）。
       不存 DOM 快照、不存 computedStyle —— 恢复时按当前样式重新渲染，
       这样改版后旧缓存也会跟着新样式走，不会复活一份「 fossil 快照」。 */
    histSave({ cls: 'a', text: (d && d.reply) || '', action: d && d.action,
               cites: d && d.citations, gap: d && d.gap });
    scrollDown();
  } catch (e) {
    if (mySeq !== seq) return;
    addMsg('a', '发送失败：' + (e && e.message ? e.message : '网络异常') + '（请稍后再试）');
  } finally {
    if (mySeq === seq) { busy = false; if (sendBtn) sendBtn.disabled = false; }
  }
}

function autoGrow() {
  if (!input) return;
  input.style.height = 'auto';
  input.style.height = Math.min(140, Math.max(44, input.scrollHeight)) + 'px';
}
if (input) {
  /* 初始化就跑一次：否则初始高度是「内容自然高度」（实测 46px），
     而发送后 autoGrow 会把它固定成 44px —— 于是**发一次消息输入框会变矮 2px**，
     按钮行跟着跳一下。这个 2px 只有量几何才看得见（截图只觉得「有点歪」）。 */
  autoGrow();
  input.addEventListener('input', autoGrow);
  // Enter 发送、Shift+Enter 换行；用属性判断而不是 e.keyCode（已废弃）
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
  });
  input.addEventListener('input', function () { if (sendBtn) sendBtn.disabled = !(input.value || '').trim() || busy; });
}
if (sendBtn) sendBtn.addEventListener('click', send);

/* ===================================================================
   运营视图（国内化一期）：读 /support/leads、改 /support/leads/status
   =================================================================== */
var OPS_FILTERS = [
  { key: 'handoff', label: '待跟进', state: 'handoff' },
  { key: 'open',    label: '咨询中', state: 'open' },
  { key: 'closed',  label: '已跟进', state: 'closed' },
  { key: '',        label: '全部',   state: '全部' }
];
var opsFilter = 'handoff';    // 简报要求：默认筛 handoff
var opsSeq = 0;

function fmtTime(v) {
  /* 后端 updated_at 是 **int 时间戳**（leads.py:104），且排序时见过 None。
     ⚠️ **固定 Asia/Shanghai，不用浏览器本地时区**（zcode 裁定5）：
     运营看的是异地客户的跟进时间——若客服与客户分处不同时区，
     「17:31」是当地时间还是国内时间会直接导致「谁先谁后」的判断出错。
     `Intl.DateTimeFormat` 带 timeZone 是唯一可靠做法
     （`Date#getHours()` 用的是运行机器的时区，不能用）。 */
  var n = Number(v);
  if (!v || !isFinite(n) || n <= 0) return '—';
  try {
    return new Intl.DateTimeFormat('zh-CN', {
      timeZone: 'Asia/Shanghai', hour12: false,
      year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit'
    }).format(new Date(n * 1000)).replace(/\//g, '-');
  } catch (e) {
    return '—';              // 极端环境不支持 Intl 时不显示错误值
  }
}

function opsMsg(text, isBad) {
  var box = document.getElementById('ops-body');
  if (!box) return;
  var m = document.querySelector('.ops-msg');
  if (!m) { m = document.createElement('div'); box.appendChild(m); }
  m.className = 'ops-msg' + (isBad ? ' bad' : '');
  m.textContent = text;             // 纯文本
  m.hidden = false;
}

function opsClearMsg() {
  var m = document.querySelector('.ops-msg');
  if (m) m.hidden = true;
}

async function loadOps() {
  var box = document.getElementById('ops-body');
  if (!box) return;
  if (!window.tokenGet || !window.tokenGet()) {
    opsMsg('需要访问令牌：请点右上角钥匙图标填入后再展开本视图', false);
    return;
  }
  var mySeq = ++opsSeq;
  var url = '/support/leads' + (opsFilter ? '?status=' + encodeURIComponent(opsFilter) : '');
  try {
    var res = await fetch(url);
    if (res.status === 401) { opsMsg('令牌无效，请在右上角重新填入', true); return; }
    if (res.status === 429) { toastOnce('429', '请求过于频繁，请稍后再试'); return; }
    var d = await res.json();
    if (mySeq !== opsSeq) return;          // 有更新的请求在飞
    if (!res.ok) { opsMsg('读取失败：HTTP ' + res.status, true); return; }
    opsClearMsg();
    renderOps(d);
  } catch (e) {
    if (mySeq !== opsSeq) return;
    opsMsg('读取失败：' + (e && e.message ? e.message : '网络异常'), true);
  }
}

function renderOps(d) {
  var box = document.getElementById('ops-body');
  if (!box) return;
  var old = box.querySelector('.ops-live');
  if (old) old.remove();
  var wrap = document.createElement('div');
  wrap.className = 'ops-live';

  var leads = Array.isArray(d && d.leads) ? d.leads : [];
  var total = (d && typeof d.handoff_count === 'number') ? d.handoff_count : null;

  /* 计数合并（zcode 裁定 6）：区块标题只留「待跟进 N」；
     「当前筛选 M 条」挪到 chip 行尾小字。
     老版把两个数并排显示，但 `handoff_count` 是**全量**待跟进数、不随筛选变，
     在 handoff 筛选下两者天然相等 ⇒ 并排看是冗余且像 bug。 */
  var title = document.createElement('div');
  title.className = 'ops-title';
  title.textContent = '待跟进 ' + (total === null ? '—' : String(total)) + ' 条';
  wrap.appendChild(title);

  // 筛选 chip（直角小标，当前项 accent 反白）
  var chips = document.createElement('div');
  chips.className = 'ops-chips';
  OPS_FILTERS.forEach(function (f) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'ops-chip' + (opsFilter === f.key ? ' on' : '');
    b.dataset.opsFilter = f.key;
    b.textContent = f.label;                 // 纯文本
    chips.appendChild(b);
  });
  var tail = document.createElement('span');
  tail.className = 'ops-chips-tail';
  tail.textContent = '筛选出 ' + leads.length + ' 条';
  chips.appendChild(tail);
  wrap.appendChild(chips);

  if (!leads.length) {
    var e = document.createElement('div');
    e.className = 'ops-empty';
    e.textContent = '这个筛选下没有线索。';
    wrap.appendChild(e);
  }
  leads.forEach(function (L) {
    wrap.appendChild(opsRow(L));
  });
  box.appendChild(wrap);
  bindSpotlight(wrap);
}

/* Spotlight 鼠标跟随光晕（magicui Glow Card，v4 配方表第 4 行）：
   mousemove 写 --x/--y，CSS 用 radial-gradient(240px at var(--x) var(--y), …) 渲染。
   一段 ~10 行 JS + 事件委托，一次绑全列表。 */
function bindSpotlight(scope) {
  if (!scope) return;
  var rows = scope.querySelectorAll('.ops-row');
  Array.prototype.forEach.call(rows, function (r) {
    r.addEventListener('mousemove', function (e) {
      var b = r.getBoundingClientRect();
      r.style.setProperty('--x', (e.clientX - b.left) + 'px');
      r.style.setProperty('--y', (e.clientY - b.top) + 'px');
    });
  });
}

function opsRow(L) {
  /* 紧凑行（v3 毛病 7：老版一张大卡一条，一屏只有 4.5 条，13 条要滚三屏）。
     现在是**表格化的一行**：时间 ·渠道 · 问题 · 状态 · 操作，行高 ≤44px，
     目标一屏 ≥12 条。 */
  var row = document.createElement('div');
  row.className = 'ops-row';

  function cell(txt, cls, title) {
    var c = document.createElement('span');
    c.className = cls;
    c.textContent = txt;                       // 纯文本：问题原文来自用户/微信
    if (title) c.title = title;
    return c;
  }

  row.appendChild(cell(fmtTime(L.updated_at), 'ops-t', 'Asia/Shanghai'));

  var isMp = L.channel === 'wechat_mp';
  row.appendChild(cell(isMp ? '微信' : (L.channel || 'web'),
                      'ops-ch' + (isMp ? ' mp' : ''),
                      '渠道：' + String(L.channel || 'web')));

  /* 「重开」小标（zcode 裁定 7）：后端 closed 后再来消息会自动重开 open，
     运营标记完若客户又来，那条会出现在「咨询中」里——
     **看不出它曾经被跟进过**，会困惑「我明明标过了」。用 handoff_count>=1 判定。 */
  var q = document.createElement('span');
  q.className = 'ops-q';
  q.textContent = String(L.last_question || '（无内容）');
  if (L.status === 'open' && Number(L.handoff_count) >= 1) {
    var tag = document.createElement('span');
    tag.className = 'ops-reopen';
    tag.textContent = '重开';
    tag.title = '已闭环后客户又来了新消息';
    q.insertBefore(tag, q.firstChild);
  }
  row.appendChild(q);

  var stTxt = L.status === 'handoff' ? '待跟进'
            : (L.status === 'closed' ? '已闭环' : '咨询中');
  row.appendChild(cell(stTxt, 'ops-st st-' + String(L.status || '')));

  var act = document.createElement('span');
  act.className = 'ops-act';
  if (L.status !== 'closed') {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'ops-btn';
    btn.dataset.opsClose = String(L.id || '');
    btn.textContent = '标记已跟进';
    act.appendChild(btn);
  } else {
    act.appendChild(cell('—', 'ops-st'));
  }
  row.appendChild(act);
  return row;
}

/* ---- 启动时恢复历史会话（裁定 8）----
   ⚠️ 位置很重要：必须在 BADGES / addCiteDetails / addGapNote / addHandoffNote **之后**。
   第一版放在 emptyState() 旁边，而 BADGES 声明在文件更下方 ——
   `var` 提升只给 undefined，于是 `BADGES[action]` 抛
   "Cannot read properties of undefined (reading 'answer')"，**整条恢复链断掉**。
   真机刷新一次就复现，属于「静态门禁全绿、jsdom 全绿，只有真刷新才炸」的那类。
   顺序也不能反：先恢复再补空态 —— addMsg 会清掉 .empty，
   反过来的话空态会被清掉、或历史被空态挤掉。 */
function restoreIfAny() {
  if (!log) return;
  var n = histRestore();
  histRestored = n > 0;
  emptyState();
  if (histRestored) scrollDown();
}
restoreIfAny();

async function closeLead(id) {
  if (!id) return;
  try {
    var res = await fetch('/support/leads/status', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ lead_id: id, status: 'closed' })
    });
    if (res.status === 401) { opsMsg('令牌无效，无法标记', true); return; }
    if (res.status === 429) { toastOnce('429', '请求过于频繁，请稍后再试'); return; }
    var d = await res.json();
    if (!res.ok) { opsMsg('标记失败：' + ((d && d.detail) || ('HTTP ' + res.status)), true); return; }
    opsClearMsg();
    await loadOps();          // 本地刷新列表：后端已是权威，不在前端做状态机
  } catch (e) {
    opsMsg('标记失败：' + (e && e.message ? e.message : '网络异常'), true);
  }
}

// 事件委托：一处监听，动态子节点无需重绑
document.addEventListener('click', function (e) {
  var chip = e.target && e.target.closest ? e.target.closest('[data-ops-filter]') : null;
  if (chip) { opsFilter = chip.dataset.opsFilter || ''; loadOps(); return; }
  var btn = e.target && e.target.closest ? e.target.closest('[data-ops-close]') : null;
  if (btn) { btn.disabled = true; closeLead(btn.dataset.opsClose); return; }
});

var opsView = document.getElementById('ops-view');
if (opsView) opsView.addEventListener('toggle', function () {
  if (opsView.open) loadOps();      // 每次展开都重新拉，避免看陈旧数据
});
</script>
</body>
</html>
